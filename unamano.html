<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>VoltRefMX · Una Mano</title>

<link rel="manifest" href="manifest.json">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VoltRefMX">

<style>
:root{
  --bg:#0c0d0f; --panel:#17191c; --panel2:#1f2226; --panel3:#26292e;
  --line:#2c2f34; --line2:#35383e;
  --text:#f3f1ea; --text2:#c7c4ba; --dim:#83868c;
  --hazard:#f6c02a; --hazard-dim:rgba(246,192,42,.14);
  --ok:#39d178; --ok-bg:rgba(57,209,120,.12);
  --warn:#f6c02a; --warn-bg:rgba(246,192,42,.12);
  --danger:#ff5252; --danger-bg:rgba(255,82,82,.12);
  --radius:16px; --radius-sm:10px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --display: -apple-system, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
  --mono: 'SF Mono', 'JetBrains Mono', ui-monospace, 'Cascadia Code', monospace;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--display); overflow:hidden; position:fixed; inset:0;
  background-image:
    radial-gradient(circle at 15% 8%, rgba(246,192,42,.05), transparent 40%),
    repeating-linear-gradient(135deg, rgba(255,255,255,.012) 0 2px, transparent 2px 26px);
}
input,button{font-family:inherit;}
#app{position:absolute; inset:0; display:flex; flex-direction:column;}

/* ===== TOP BAR (glance zone) ===== */
.topbar{
  padding: calc(10px + var(--safe-t)) 14px 8px;
  display:flex; align-items:center; gap:10px; flex-shrink:0;
}
.tb-back{
  width:40px; height:40px; border-radius:12px; border:1px solid var(--line);
  background:var(--panel); color:var(--text); font-size:18px;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.tb-back:active{background:var(--panel2);}
.tb-title{flex:1; min-width:0;}
.tb-title .t1{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); font-weight:700;}
.tb-title .t2{font-size:16px; font-weight:800; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.tb-gauge{width:46px; height:46px; flex-shrink:0; position:relative;}
.tb-gauge svg{width:100%; height:100%; transform:rotate(-90deg);}
.tb-gauge .bgring{fill:none; stroke:var(--line); stroke-width:5;}
.tb-gauge .fgring{fill:none; stroke:var(--hazard); stroke-width:5; stroke-linecap:round; transition:stroke-dashoffset .35s ease;}
.tb-gauge .num{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:12px; font-weight:700; color:var(--text2);}

/* ===== MAIN SCROLL AREA ===== */
.stage{flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch;}
.stage::-webkit-scrollbar{display:none;}

/* ===== BOTTOM ACTION BAR (thumb zone) ===== */
.actionbar{
  flex-shrink:0; padding:10px 14px calc(12px + var(--safe-b));
  display:flex; gap:10px; background:linear-gradient(180deg, transparent, var(--bg) 30%);
}
.btn{
  flex:1; height:56px; border-radius:14px; border:1px solid var(--line);
  background:var(--panel); color:var(--text); font-size:16px; font-weight:800;
  display:flex; align-items:center; justify-content:center; gap:8px;
}
.btn:active{transform:scale(.97); background:var(--panel2);}
.btn-primary{background:var(--hazard); color:#141414; border-color:var(--hazard);}
.btn-primary:active{background:#e0af1f;}
.btn-ghost{flex:0 0 56px; background:transparent;}
.btn[disabled]{opacity:.35; pointer-events:none;}

/* ===== BOTTOM TAB NAV (home/list screens only) ===== */
.tabnav{
  flex-shrink:0; display:flex; padding:6px 6px calc(6px + var(--safe-b));
  background:var(--panel); border-top:1px solid var(--line);
}
.tab{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:8px 2px; border-radius:12px; color:var(--dim); font-size:10.5px; font-weight:700;
  letter-spacing:.02em;
}
.tab .ic{font-size:20px; line-height:1;}
.tab.active{color:var(--hazard);}
.tab:active{background:var(--panel2);}

/* ===== HOME ===== */
.home-hero{padding:6px 20px 18px;}
.home-brand{font-size:13px; letter-spacing:.22em; color:var(--dim); font-weight:800; text-transform:uppercase;}
.home-title{font-size:30px; font-weight:900; margin-top:4px; line-height:1.05;}
.home-title em{color:var(--hazard); font-style:normal;}
.home-sub{color:var(--dim); font-size:13.5px; margin-top:6px;}
.section-lbl{padding:0 20px; font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); font-weight:800; margin:18px 0 8px;}
.tilewrap{padding:0 16px; display:flex; flex-direction:column; gap:10px;}
.tile{
  display:flex; align-items:center; gap:14px; padding:16px; border-radius:var(--radius);
  background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--tc,var(--hazard));
  position:relative; overflow:hidden;
}
.tile:active{background:var(--panel2);}
.tile .ic{width:46px; height:46px; border-radius:12px; background:var(--tc-bg, var(--hazard-dim)); display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0;}
.tile .body{flex:1; min-width:0;}
.tile .name{font-size:16px; font-weight:800;}
.tile .desc{font-size:12.5px; color:var(--dim); margin-top:2px;}
.tile .go{color:var(--dim); font-size:20px;}
.tile-row{display:flex; gap:10px;}
.tile-row .tile{flex:1; flex-direction:column; align-items:flex-start; gap:8px; padding:14px;}
.tile-row .tile .name{font-size:13.5px;}

/* ===== WIZARD STEP ===== */
.step{padding:6px 22px 30px; min-height:100%; display:flex; flex-direction:column;}
.step-eyebrow{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--hazard); font-weight:800; margin-bottom:8px;}
.step-q{font-size:23px; font-weight:800; line-height:1.22; margin-bottom:6px;}
.step-hint{font-size:13px; color:var(--dim); margin-bottom:22px; line-height:1.4;}
.step-body{flex:1; display:flex; flex-direction:column; justify-content:center; gap:14px; padding:10px 0 20px;}

/* number stepper */
.numpad{display:flex; flex-direction:column; align-items:center; gap:18px;}
.numrow{display:flex; align-items:center; gap:18px;}
.numbtn{
  width:54px; height:54px; border-radius:50%; border:1px solid var(--line2);
  background:var(--panel2); color:var(--text); font-size:24px; font-weight:800;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.numbtn:active{background:var(--panel3); transform:scale(.94);}
.numdisplay{display:flex; flex-direction:column; align-items:center; min-width:150px;}
.numdisplay input{
  width:100%; text-align:center; background:transparent; border:none; color:var(--text);
  font-family:var(--mono); font-size:52px; font-weight:800; font-variant-numeric:tabular-nums;
  outline:none; caret-color:var(--hazard);
}
.numunit{font-size:13px; color:var(--dim); letter-spacing:.08em; text-transform:uppercase; font-weight:700; margin-top:-6px;}
.presetrow{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:6px;}
.preset{
  padding:8px 14px; border-radius:20px; border:1px solid var(--line2); background:var(--panel2);
  color:var(--text2); font-size:13px; font-weight:700; font-family:var(--mono);
}
.preset.active{background:var(--hazard); color:#141414; border-color:var(--hazard);}
.preset:active{transform:scale(.95);}

/* choice cards */
.choices{display:flex; flex-direction:column; gap:10px;}
.choice{
  display:flex; align-items:center; gap:14px; padding:16px 16px; border-radius:14px;
  background:var(--panel); border:1.5px solid var(--line);
}
.choice .ic{font-size:24px; width:34px; text-align:center; flex-shrink:0;}
.choice .txt{flex:1;}
.choice .t1{font-size:15.5px; font-weight:800;}
.choice .t2{font-size:12px; color:var(--dim); margin-top:1px;}
.choice.sel{border-color:var(--hazard); background:var(--hazard-dim);}
.choice:active{transform:scale(.98);}

/* segmented toggle */
.segwrap{display:flex; background:var(--panel2); border-radius:14px; padding:4px; border:1px solid var(--line);}
.seg{flex:1; text-align:center; padding:12px 6px; border-radius:11px; font-size:14px; font-weight:800; color:var(--dim);}
.seg.active{background:var(--hazard); color:#141414;}

/* card list (calibre picker etc) */
.picklist{display:flex; flex-direction:column; gap:8px; max-height:100%;}
.pickitem{
  display:flex; justify-content:space-between; align-items:center; padding:14px 16px;
  border-radius:12px; background:var(--panel); border:1.5px solid var(--line);
}
.pickitem .l{font-family:var(--mono); font-size:15px; font-weight:800;}
.pickitem .r{font-size:12px; color:var(--dim); font-family:var(--mono);}
.pickitem.sel{border-color:var(--hazard); background:var(--hazard-dim);}
.searchbar{
  display:flex; align-items:center; gap:8px; background:var(--panel2); border:1px solid var(--line);
  border-radius:12px; padding:10px 14px; margin-bottom:12px;
}
.searchbar input{flex:1; background:transparent; border:none; color:var(--text); font-size:15px; outline:none;}

/* dots progress alt */
.dots{display:flex; gap:6px; justify-content:center; margin-top:10px;}
.dot{width:6px; height:6px; border-radius:50%; background:var(--line2);}
.dot.on{background:var(--hazard); width:16px; border-radius:4px;}

/* ===== RESULT SCREEN ===== */
.res{padding:10px 20px 30px;}
.res-badge{
  display:inline-flex; align-items:center; gap:8px; padding:8px 16px; border-radius:20px;
  font-size:13px; font-weight:800; letter-spacing:.04em; margin-bottom:16px;
}
.res-badge.ok{background:var(--ok-bg); color:var(--ok);}
.res-badge.warn{background:var(--warn-bg); color:var(--warn);}
.res-badge.danger{background:var(--danger-bg); color:var(--danger);}
.res-hero{text-align:center; padding:22px 10px 26px; background:var(--panel); border-radius:var(--radius); border:1px solid var(--line); margin-bottom:16px;}
.res-hero .lbl{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); font-weight:800;}
.res-hero .val{font-family:var(--mono); font-size:48px; font-weight:900; margin-top:8px; font-variant-numeric:tabular-nums;}
.res-hero .val .u{font-size:20px; color:var(--dim); margin-left:4px;}
.res-hero .sub{font-size:13px; color:var(--text2); margin-top:6px;}
.res-grid{display:flex; flex-direction:column; gap:8px; margin-bottom:16px;}
.res-row{
  display:flex; justify-content:space-between; align-items:center; padding:13px 15px;
  background:var(--panel); border-radius:12px; border:1px solid var(--line);
}
.res-row .k{font-size:13px; color:var(--text2);}
.res-row .v{font-family:var(--mono); font-size:14.5px; font-weight:800;}
.res-row.hi .v{color:var(--hazard);}
.res-note{
  font-size:12.5px; color:var(--dim); line-height:1.55; padding:12px 14px; background:var(--panel2);
  border-radius:12px; border-left:3px solid var(--line2);
}
.res-note b{color:var(--text2);}
.res-note.warn{border-left-color:var(--warn); background:var(--warn-bg); color:var(--text2);}

/* ===== REFERENCE (colores / vfd) ===== */
.refcard{
  margin:0 16px 12px; padding:16px; background:var(--panel); border-radius:14px; border:1px solid var(--line);
}
.refcard h3{margin:0 0 10px; font-size:15px; font-weight:800; display:flex; align-items:center; gap:8px;}
.swatchrow{display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--line);}
.swatchrow:first-of-type{border-top:none;}
.swatch{width:26px; height:26px; border-radius:7px; border:1px solid rgba(255,255,255,.15); flex-shrink:0;}
.swatchrow .l{flex:1; font-size:13.5px; font-weight:700;}
.swatchrow .r{font-size:12px; color:var(--dim); font-family:var(--mono);}
.chip{display:inline-block; padding:3px 9px; border-radius:8px; font-size:11px; font-weight:800; margin-left:6px;}
.chip.danger{background:var(--danger-bg); color:var(--danger);}
.chip.warn{background:var(--warn-bg); color:var(--warn);}
.vfd-item{margin:0 16px 10px; border-radius:14px; background:var(--panel); border:1px solid var(--line); overflow:hidden;}
.vfd-head{display:flex; align-items:center; gap:12px; padding:14px 16px;}
.vfd-head .code{font-family:var(--mono); font-size:17px; font-weight:900; width:56px; flex-shrink:0;}
.vfd-head .name{flex:1; font-size:14px; font-weight:700;}
.vfd-body{padding:0 16px 16px; font-size:13px; color:var(--text2); line-height:1.6; display:none;}
.vfd-item.open .vfd-body{display:block;}
.vfd-body b{color:var(--text);}
.vfd-body .sec{margin-top:10px; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); font-weight:800;}

/* ===== TABLAS DE REFERENCIA (Curvas / Seguridad / Herramientas / PLC / Instr / Control / IEC) ===== */
.rtable-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -16px; padding:0 16px;}
.rtable{width:100%; min-width:max-content; border-collapse:collapse; font-size:12.5px;}
.rtable th{text-align:left; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); font-weight:800; padding:0 14px 8px 0; white-space:nowrap;}
.rtable td{padding:9px 14px 9px 0; border-top:1px solid var(--line); vertical-align:top; white-space:nowrap;}
.rtable td:first-child{font-weight:700;}
.rtable .mono{font-family:var(--mono);}
.star{color:var(--hazard);}
.chip.ok{background:var(--ok-bg); color:var(--ok);}
.subhead{font-size:13.5px; font-weight:800; margin:14px 0 8px; color:var(--text2); display:flex; align-items:center; gap:8px;}
.subhead:first-child{margin-top:0;}
.loto-step{display:flex; gap:12px; padding:12px 0; border-top:1px solid var(--line);}
.loto-step:first-child{border-top:none;}
.loto-num{width:28px; height:28px; border-radius:50%; background:var(--hazard); color:#141414; font-weight:900; font-size:13px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.loto-verb{font-size:14px; font-weight:800;}
.loto-desc{font-size:12.5px; color:var(--dim); margin-top:3px; line-height:1.5;}

.hidden{display:none !important;}

/* ===== ADAPTACIÓN A PANTALLA ANCHA (laptop/escritorio) =====
   Mismo criterio que Tablero. Una Mano usa un ancho máximo más angosto
   porque su diseño es de flujo vertical tipo wizard, no dashboard. */
@media (min-width:701px){
  #app{ align-items:center; }
  #app > .stage,
  #app > .tabnav,
  #app > .topbar,
  #app > .actionbar{
    width:100%;
    max-width:480px;
  }
}
</style>
</head>

// Escapa comillas en valores que se embeben dentro de atributos onclick="..."
// (bug real: valores como 1/2" rompían el atributo HTML y dejaban los botones sin responder)
function escJs(v){ return String(v).replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
// Escapa texto libre (ej. nota del historial) antes de insertarlo como contenido HTML
function escHtml(v){ return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Historial de cálculos guardados — localStorage (por dispositivo/navegador, no sincroniza solo)
const Historial = {
  KEY: 'voltrefmx_historial',
  listar(){ try{ return JSON.parse(localStorage.getItem(this.KEY)||'[]'); }catch(e){ return []; } },
  guardar(entry){ const arr=this.listar(); arr.unshift(entry); localStorage.setItem(this.KEY, JSON.stringify(arr)); },
  eliminar(id){ const arr=this.listar().filter(e=>e.id!==id); localStorage.setItem(this.KEY, JSON.stringify(arr)); },
  exportar(){ return JSON.stringify(this.listar(), null, 2); },
  importar(json){ try{ const arr=JSON.parse(json); if(Array.isArray(arr)){ localStorage.setItem(this.KEY, JSON.stringify(arr)); return true; } }catch(e){} return false; }
};
function esc(s){ return (s+'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  caps: {
    id:'caps', label:'Banco de Capacitores', ic:'⚡', tc:'#eab308', tcbg:'rgba(234,179,8,.14)',
    desc:'Corrección de FP — kVAR necesarios', historial:true,
    steps:[
      {key:'kw', type:'number', q:'¿Potencia activa de la carga?', unit:'kW', min:1, max:5000, step:1, default:100, presets:[50,100,200,500]},
      {key:'fp1', type:'number', q:'¿Factor de potencia actual (medido)?', unit:'', min:0.5, max:0.99, step:0.01, default:0.80, presets:[0.75,0.80,0.85]},
      {key:'fp2', type:'segment', q:'¿A qué FP quieres corregir?', options:[{v:0.90,label:'0.90'},{v:0.95,label:'0.95'},{v:1.00,label:'1.00'}], default:0.95},
      {key:'v', type:'number', q:'¿Tensión del sistema?', unit:'V', min:110, max:15000, step:1, default:440, presets:[220,440,480]},
      {key:'vfd', type:'segment', q:'¿Hay VFDs u otras cargas no lineales en esa misma red?', options:[{v:'no',label:'No'},{v:'si',label:'Sí'}], default:'no'},
    ],
    compute(a){
      const phi1 = Math.acos(a.fp1), phi2 = Math.acos(a.fp2);
      const kvarNecesarios = a.kw*(Math.tan(phi1)-Math.tan(phi2));
      const kvarComercial = roundStdKvar(kvarNecesarios);
      const kvaAntes = a.kw/a.fp1;
      const kvaDespues = a.kw/a.fp2;
      const iAntes = kvaAntes*1000/(Math.sqrt(3)*a.v);
      const iDespues = kvaDespues*1000/(Math.sqrt(3)*a.v);
      const reduccion = (1-iDespues/iAntes)*100;
      // FP real alcanzado con el kVAR comercial redondeado (no el teórico exacto)
      const kvarResidual = a.kw*Math.tan(phi1) - kvarComercial;
      const kvaReal = Math.sqrt(a.kw*a.kw + kvarResidual*kvarResidual);
      const fpReal = a.kw/kvaReal;
      return {kvarNecesarios,kvarComercial,kvaAntes,kvaDespues,iAntes,iDespues,reduccion,fpReal,a};
    },
    renderResult(r){
      return `
      <div class="res-badge ok">✔ kVAR comercial: ${fmt(r.kvarComercial,1)}</div>
      <div class="res-hero">
        <div class="lbl">kVAR necesarios (teórico)</div>
        <div class="val">${fmt(r.kvarNecesarios,1)}<span class="u">kVAR</span></div>
        <div class="sub">${r.a.kw} kW · FP ${r.a.fp1} → ${r.a.fp2} · ${r.a.v} V trifásico</div>
      </div>
      <div class="res-grid">
        <div class="res-row hi"><div class="k">Banco comercial recomendado</div><div class="v">${fmt(r.kvarComercial,1)} kVAR</div></div>
        <div class="res-row"><div class="k">FP real alcanzado</div><div class="v">${fmt(r.fpReal,2)}</div></div>
        <div class="res-row"><div class="k">Corriente antes → después</div><div class="v">${fmt(r.iAntes,1)} → ${fmt(r.iDespues,1)} A</div></div>
        <div class="res-row"><div class="k">Reducción de corriente</div><div class="v">${fmt(r.reduccion,1)}%</div></div>
      </div>
      ${r.a.vfd==='si'?`<div class="res-note" style="color:#ff5252;font-weight:600">⚠ Hay VFDs en la red: NO instalar el banco sin reactor de bloqueo (detuned, típico 5.67% o 7%). Un capacitor sin protección de armónicos puede entrar en resonancia con la red y destruirse.</div>`:''}
      <div class="res-note">kVAR real de un capacitor escala con (V_real/V_nominal)² — verifica la tensión real de operación contra la placa del banco antes de dar por bueno el cálculo. Redondeo a valor comercial más cercano por arriba.</div>`;
    },
    summary(r){ return `${fmt(r.kvarComercial,1)} kVAR · FP ${r.a.fp1}→${r.a.fp2} · ${r.a.v}V${r.a.vfd==='si'?' · ⚠ VFD':''}`; }
  },

  ups: {
    id:'ups', label:'UPS — Autonomía / Batería', ic:'🔋', tc:'#0ea5e9', tcbg:'rgba(14,165,233,.14)',
    desc:'Dimensionamiento de UPS y banco de baterías', historial:true,
    steps:[
      {key:'modo', type:'segment', q:'¿Qué quieres calcular?', options:[{v:'auto',label:'Autonomía (ya tengo el banco)'},{v:'ah',label:'Ah necesarios (tengo el tiempo)'}], default:'auto'},
      {key:'w', type:'number', q:'¿Carga total a proteger?', unit:'W', min:10, max:20000, step:10, default:500, presets:[100,300,500,1000]},
      {key:'fpc', type:'number', q:'¿FP de la carga?', hint:'Fuentes conmutadas sin corregir: 0.65-0.75 típico. PLC/HMI industrial listado: hasta 1.0 si el fabricante lo especifica.', unit:'', min:0.5, max:1.0, step:0.01, default:0.70, presets:[0.65,0.70,0.80,1.00]},
      {key:'margen', type:'segment', q:'¿Margen de crecimiento?', options:[{v:0,label:'0%'},{v:0.20,label:'20%'},{v:0.30,label:'30%'}], default:0.20},
      {key:'ah', type:'number', q:'¿Capacidad del banco de baterías?', unit:'Ah', min:1, max:2000, step:1, default:100, presets:[7,20,50,100], show:a=>a.modo==='auto'},
      {key:'tmin', type:'number', q:'¿Tiempo de autonomía deseado?', unit:'min', min:1, max:480, step:1, default:10, presets:[5,10,15,30], show:a=>a.modo==='ah'},
      {key:'vdc', type:'number', q:'¿Tensión del banco DC?', unit:'V', min:6, max:400, step:1, default:24, presets:[12,24,48,110]},
      {key:'bat', type:'segment', q:'¿Tipo de batería?', options:[{v:0.5,label:'Plomo-ácido (DoD 50%)'},{v:0.8,label:'Litio (DoD 80%)'}], default:0.5},
      {key:'eta', type:'number', q:'¿Eficiencia del inversor?', unit:'', min:0.7, max:0.99, step:0.01, default:0.90, presets:[0.85,0.90,0.92]},
    ],
    compute(a){
      const vaCarga = a.w/a.fpc;
      const kvaRecomendado = roundStdKva((vaCarga*(1+a.margen))/1000);
      let autoninMin=null, ahNecesarios=null;
      if(a.modo==='auto'){
        const horas = (a.ah*a.vdc*a.bat*a.eta)/a.w;
        autoninMin = horas*60;
      } else {
        const horas = a.tmin/60;
        ahNecesarios = (a.w*horas)/(a.vdc*a.bat*a.eta);
      }
      const iDescarga = (a.w/a.eta)/a.vdc;
      return {vaCarga,kvaRecomendado,autoninMin,ahNecesarios,iDescarga,a};
    },
    renderResult(r){
      const principal = r.a.modo==='auto'
        ? {lbl:'Autonomía estimada', val:fmt(r.autoninMin,1), u:'min'}
        : {lbl:'Ah necesarios', val:fmt(r.ahNecesarios,1), u:'Ah'};
      return `
      <div class="res-badge ok">✔ UPS recomendado: ${r.kvaRecomendado} kVA</div>
      <div class="res-hero">
        <div class="lbl">${principal.lbl}</div>
        <div class="val">${principal.val}<span class="u">${principal.u}</span></div>
        <div class="sub">${r.a.w} W · FP ${r.a.fpc} · banco ${r.a.vdc} V DC</div>
      </div>
      <div class="res-grid">
        <div class="res-row hi"><div class="k">Capacidad UPS recomendada</div><div class="v">${r.kvaRecomendado} kVA</div></div>
        <div class="res-row"><div class="k">VA de carga (con margen)</div><div class="v">${fmt(r.vaCarga*(1+r.a.margen),0)} VA</div></div>
        <div class="res-row"><div class="k">Corriente de descarga del banco</div><div class="v">${fmt(r.iDescarga,2)} A</div></div>
      </div>
      <div class="res-note">Vida útil de batería plomo-ácido se reduce a la mitad por cada 8-10°C sobre 25°C — considera la temperatura real del gabinete, no la de catálogo. Topología online (doble conversión) recomendada cerca de VFDs.</div>`;
    },
    summary(r){
      const principal = r.a.modo==='auto' ? `${fmt(r.autoninMin,1)} min` : `${fmt(r.ahNecesarios,1)} Ah`;
      return `${principal} · ${r.a.w}W · ${r.a.vdc}V DC · UPS ${r.kvaRecomendado}kVA`;
    }
  }
};

const App = {

  goHome(){ ST.screen='home'; render(); },
  goRefList(){ ST.screen='refhome'; render(); },
  goMore(){ ST.screen='more'; render(); },

  openModule(id){
    ST.modId=id; ST.stepIdx=0; ST.answers={};
    const mod = MODULES_C[id];
    mod.steps.forEach(s=>{ if(typeof s.default!=='undefined') ST.answers[s.key]=s.default; });
    ST.screen='wizard'; render();
  },

  activeSteps(mod){ return mod.steps.filter(s=>!s.show || s.show(ST.answers)); },

  setAnswer(key, val, autoAdvance){
    ST.answers[key]=val;
    if(autoAdvance){ App.nextStep(); } else { render(); }
  },

  nudge(key, delta, min, max){
    let v = (ST.answers[key]||0) + delta;
    if(min!==undefined) v=Math.max(min,v);
    if(max!==undefined) v=Math.min(max,v);
    v = Math.round(v*100)/100;
    ST.answers[key]=v; render();
  },

  typeNum(key, val){ ST.answers[key] = val===''? '' : parseFloat(val); },

  nextStep(){
    const mod = MODULES_C[ST.modId];
    const steps = App.activeSteps(mod);
    if(ST.stepIdx < steps.length-1){ ST.stepIdx++; render(); }
    else { App.finish(); }
  },
  prevStep(){
    if(ST.stepIdx>0){ ST.stepIdx--; render(); }
    else { ST.screen='home'; render(); }
  },

  finish(){ ST.screen='result'; render(); },
  newCalc(){ App.openModule(ST.modId); },

  openRef(id){ ST.screen='ref-'+id; render(); },

  toggleVfd(code){ ST.vfdOpen[code]=!ST.vfdOpen[code]; render(); },
  setVfdFilter(v){ ST.vfdFilter=v; render(); },

  goHistorial(){ ST.screen='historial'; render(); },

  saveToHistorial(){
    const mod = MODULES_C[ST.modId];
    if(!mod || !mod.historial) return;
    const res = mod.compute(ST.answers);
    const nota = prompt('¿Proyecto o área? (opcional)', '') || '';
    const entry = {
      id: Date.now()+'_'+Math.random().toString(36).slice(2,7),
      fecha: new Date().toISOString(),
      modulo: mod.id, moduloLabel: mod.label,
      nota, respuestas: {...ST.answers},
      resumen: mod.summary ? mod.summary(res) : ''
    };
    Historial.guardar(entry);
    alert('✔ Guardado en historial');
    render();
  },

  loadHistorialEntry(id){
    const entry = Historial.listar().find(e=>e.id===id);
    if(!entry) return;
    ST.modId = entry.modulo;
    ST.answers = {...entry.respuestas};
    ST.screen = 'result';
    render();
  },

  deleteHistorialEntry(id){
    if(!confirm('¿Eliminar este cálculo del historial?')) return;
    Historial.eliminar(id);
    render();
  },

  exportHistorial(){
    const data = Historial.exportar();
    const blob = new Blob([data], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download='voltrefmx_historial_'+Date.now()+'.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  },

  importHistorial(file){
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(e){
      const ok = Historial.importar(e.target.result);
      alert(ok? '✔ Historial importado' : '✘ Archivo inválido — debe ser un .json exportado desde aquí mismo');
      render();
    };
    reader.readAsText(file);
  },
};
window.App = App;

/* ---- WIZARD ---- */
function gaugeSvg(idx, total){
  const r=18, c=2*Math.PI*r;
  const pct = total<=1?1:(idx)/(total-1);
  const off = c*(1-pct);
  return `<div class="tb-gauge"><svg viewBox="0 0 46 46">
    <circle class="bgring" cx="23" cy="23" r="${r}"/>
    <circle class="fgring" cx="23" cy="23" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
  </svg><div class="num">${idx+1}/${total}</div></div>`;
}

function renderWizard(){
  const mod = MODULES_C[ST.modId];
  const steps = App.activeSteps(mod);
  const step = steps[ST.stepIdx];
  const total = steps.length;

  let body='';
  if(step.type==='choice'){
    body = `<div class="choices">${step.options.map(o=>`
      <div class="choice ${ST.answers[step.key]===o.v?'sel':''}" onclick="App.setAnswer('${step.key}', ${typeof o.v==='number'?o.v:`'${escJs(o.v)}'`}, true)">
        <div class="ic">${o.ic||''}</div>
        <div class="txt"><div class="t1">${o.t1}</div><div class="t2">${o.t2||''}</div></div>
      </div>`).join('')}</div>`;
  } else if(step.type==='segment'){
    body = `<div class="segwrap">${step.options.map(o=>`
      <div class="seg ${ST.answers[step.key]===o.v?'active':''}" onclick="App.setAnswer('${step.key}', ${typeof o.v==='number'?o.v:`'${escJs(o.v)}'`})">${o.label}</div>`).join('')}</div>`;
  } else if(step.type==='number'){
    const unit = typeof step.unit==='function'? step.unit(ST.answers) : step.unit;
    const val = ST.answers[step.key];
    body = `
    <div class="numpad">
      <div class="numrow">
        <div class="numbtn" onclick="App.nudge('${step.key}', -${step.step}, ${step.min}, ${step.max})">−</div>
        <div class="numdisplay">
          <input type="number" inputmode="decimal" value="${val}" data-autofocus
            oninput="App.typeNum('${step.key}', this.value)">
          <div class="numunit">${unit}</div>
        </div>
        <div class="numbtn" onclick="App.nudge('${step.key}', ${step.step}, ${step.min}, ${step.max})">+</div>
      </div>
      ${step.presets?`<div class="presetrow">${step.presets.map(p=>`
        <div class="preset ${val===p?'active':''}" onclick="App.setAnswer('${step.key}', ${p})">${p}</div>`).join('')}</div>`:''}
    </div>`;
  } else if(step.type==='picklist'){
    const list = typeof step.list==='function' ? step.list(ST.answers) : step.list;
    body = `<div class="picklist">${list.map(o=>`
      <div class="pickitem ${ST.answers[step.key]===o.v?'sel':''}" onclick="App.setAnswer('${step.key}', '${escJs(o.v)}', true)">
        <div class="l">${o.l}</div><div class="r">${o.r||''}</div>
      </div>`).join('')}</div>`;
  }

  return `
  <div class="topbar">
    <div class="tb-back" onclick="App.prevStep()">←</div>
    <div class="tb-title"><div class="t1" style="color:${mod.tc}">${mod.label}</div><div class="t2">${step.q}</div></div>
    ${gaugeSvg(ST.stepIdx, total)}
  </div>
  <div class="stage">
    <div class="step">
      <div class="step-eyebrow">Paso ${ST.stepIdx+1} de ${total}</div>
      <div class="step-q">${step.q}</div>
      ${step.hint?`<div class="step-hint">${step.hint}</div>`:''}
      <div class="step-body">${body}</div>
      <div class="dots">${steps.map((s,i)=>`<div class="dot ${i===ST.stepIdx?'on':''}"></div>`).join('')}</div>
    </div>
  </div>
  <div class="actionbar">
    <div class="btn btn-ghost" onclick="App.prevStep()">←</div>
    <div class="btn btn-primary" onclick="App.nextStep()">${ST.stepIdx===total-1?'Ver resultado':'Siguiente'} →</div>
  </div>`;
}

function renderResultScreen(){
