const App = {
  toggleTheme(){ ST.theme = ST.theme==='light'?'dark':'light'; document.body.classList.toggle('theme-dark', ST.theme==='dark'); render(); },
  toggleSidebar(){ ST.sidebarOpen=!ST.sidebarOpen; render(); },
  closeSidebar(){ ST.sidebarOpen=false; render(); },
  goHome(){ ST.screen='home'; ST.sidebarOpen=false; render(); },
  openModule(id){
    ST.modId=id; ST.answers={};
    MODULES_A[id].fields.forEach(f=>{ if(typeof f.default!=='undefined') ST.answers[f.key]=f.default; });
    if(MODULES_A[id].init) MODULES_A[id].init();
    ST.screen='mod'; ST.sidebarOpen=false; render();
  },
  openRef(id){ ST.screen='ref-'+id; ST.sidebarOpen=false; render(); },

  activeFields(mod){ return mod.fields.filter(f=>!f.show || f.show(ST.answers)); },

  setAns(key,val){ ST.answers[key]=val; render(); },
  nudge(key,delta,min,max){
    let v=(parseFloat(ST.answers[key])||0)+delta;
    if(min!==undefined) v=Math.max(min,v); if(max!==undefined) v=Math.min(max,v);
    v=Math.round(v*100)/100; ST.answers[key]=v; render();
  },
  numInput(key,val){ ST.answers[key]= val===''?'':parseFloat(val); updateResultOnly(); },

  toggleVfd(code){ ST.vfdOpen[code]=!ST.vfdOpen[code]; render(); },
  toggleFormula(id){ ST.formulaOpen[id]=!ST.formulaOpen[id]; render(); },
  setVfdFilter(v){ ST.vfdFilter=v; renderVfdListOnly(); },

  // ---- Conversor ----
  toggleConv(){
    if(ST.screen==='conv'){ ST.screen = ST.convReturn || 'home'; }
    else { ST.convReturn = ST.screen; ST.screen = 'conv'; }
    ST.sidebarOpen=false; render();
  },
  closeConvScreen(){ ST.screen = ST.convReturn || 'home'; render(); },
  setConvTab(id){ ST.conv.tab=id; render(); },

  // Nota: cada convSet* de abajo actualiza SOLO su div de salida (por id),
  // nunca el <input> — así no se pierde el foco/teclado ni se reescribe
  // el value a medio tecleo (eso era lo que borraba el punto decimal).
  convSetVal(key,val){
    ST.conv.vals[key].v = val===''?'':parseFloat(val);
    if(key==='temp'){ const s=document.getElementById('convout-temp'); if(s) s.innerHTML = tempOutHtml(); }
    else { const s=document.getElementById('convout-'+key); if(s) s.innerHTML = convOutRowsHtml(key); }
  },
  convSetUnit(key,u){ ST.conv.vals[key].u = u; render(); },

  convSetRpmVal(val){ ST.conv.vals.rpmhz.v = val===''?'':parseFloat(val); const s=document.getElementById('convout-rpmhz'); if(s) s.innerHTML = rpmOutHtml(); },
  convSetRpmMode(mode){ ST.conv.vals.rpmhz.mode = mode; render(); },
  convSetRpmPoles(p){ ST.conv.vals.rpmhz.poles = p; render(); },

  convSetCableAwg(v){ ST.conv.vals.cable.awg = v; render(); },
  convSetCableMm2(val){ ST.conv.vals.cable.mm2rev = val===''?'':parseFloat(val); const s=document.getElementById('convout-cable-closest'); if(s) s.innerHTML = cableClosestOutHtml(); },
  convSetCableCondSize(v){ ST.conv.vals.cable.condSize = v; render(); },

  convSetLoopMode(mode){ ST.conv.vals.loop.mode = mode; render(); },
  convSetLoopField(field,val){ ST.conv.vals.loop[field] = val===''?'':parseFloat(val); const s=document.getElementById('convout-loop'); if(s) s.innerHTML = loopOutHtml(); },

  goHistorial(){ ST.screen='historial'; ST.sidebarOpen=false; render(); },

  saveToHistorial(){
    const mod = MODULES_A[ST.modId];
    if(!mod || !mod.historial) return;
    const res = mod.compute(ST.answers);
    const nota = prompt('¿Proyecto o área? (opcional)', '') || '';
    const entry = {
      id: Date.now()+'_'+Math.random().toString(36).slice(2,7),
      fecha: new Date().toISOString(),
      modulo: mod.id, moduloLabel: mod.label,
      nota, respuestas: {...ST.answers},
      resumen: mod.summary ? mod.summary(res) : ''
    };
    Historial.guardar(entry);
    alert('✔ Guardado en historial');
  },

  loadHistorialEntry(id){
    const entry = Historial.listar().find(e=>e.id===id);
    if(!entry) return;
    ST.modId = entry.modulo;
    ST.answers = {...entry.respuestas};
    ST.screen = 'mod';
    render();
  },

  deleteHistorialEntry(id){
    if(!confirm('¿Eliminar este cálculo del historial?')) return;
    Historial.eliminar(id);
    render();
  },

  exportHistorial(){
    const data = Historial.exportar();
    const blob = new Blob([data], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download='voltrefmx_historial_'+Date.now()+'.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  },

  importHistorial(file){
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(e){
      const ok = Historial.importar(e.target.result);
      alert(ok? '✔ Historial importado' : '✘ Archivo inválido — debe ser un .json exportado desde aquí mismo');
      render();
    };
    reader.readAsText(file);
  },
};

  if(ST.screen==='home') html = statusbar('DASHBOARD PRINCIPAL') + renderHome();
  else if(ST.screen==='mod') html = renderModuleScreen();
  else if(ST.screen==='ref-conductores') html = statusbar('REFERENCIA · CONDUCTORES') + renderConductoresRef();
  else if(ST.screen==='ref-factores') html = statusbar('REFERENCIA · FACTORES DE CORRECCIÓN') + renderFactoresRef();

/* ---- FORMULARIO DE MÓDULO ---- */
function fieldRow(f){
  const val = ST.answers[f.key];
  if(f.type==='number'){
    const unit = typeof f.unit==='function'? f.unit(ST.answers) : f.unit;
    return `<div class="frow">
      <div class="flabel">${f.label}</div>
      <div class="fctrl">
        <div class="fstep" onclick="App.nudge('${f.key}',-${f.step},${f.min},${f.max})">−</div>
        <input class="fnum" type="text" inputmode="decimal" pattern="[0-9]*[.,]?[0-9]*" value="${val}" oninput="App.numInput('${f.key}', this.value)">
        <div class="funit">${unit}</div>
        <div class="fstep" onclick="App.nudge('${f.key}',${f.step},${f.min},${f.max})">+</div>
      </div>
    </div>`;
  }
  if(f.type==='segment'){
    return `<div class="frow">
      <div class="flabel">${f.label}</div>
      <div class="fseg">${f.options.map(o=>`<div class="o ${val===o.v?'active':''}" onclick="App.setAns('${f.key}', ${typeof o.v==='number'?o.v:`'${escJs(o.v)}'`})">${o.l}</div>`).join('')}</div>
    </div>`;
  }
  if(f.type==='choice'){
    return `<div class="frow">
      <div class="flabel">${f.label}</div>
      <div class="fchoice-row">${f.options.map(o=>`<div class="fchoice ${val===o.v?'active':''}" onclick="App.setAns('${f.key}', '${escJs(o.v)}')">${o.l}</div>`).join('')}</div>
    </div>`;
  }
  if(f.type==='select'){
    const opts = typeof f.opts==='function' ? f.opts(ST.answers) : f.opts;
    return `<div class="frow">
      <div class="flabel">${f.label}</div>
      <select class="fselect" onchange="App.setAns('${f.key}', this.value)">
        ${opts.map(o=>`<option value="${escJs(o.v)}" ${String(val)===String(o.v)?'selected':''}>${o.l}</option>`).join('')}
      </select>
    </div>`;
  }
  return '';
}

function formulaBoxHtml(mod, res){
  if(!mod.formula) return '';
  const f = mod.formula(res);
  const open = !!ST.formulaOpen[mod.id];
  return `
  <div class="fmlbox">
    <div class="fml-toggle" onclick="App.toggleFormula('${mod.id}')"><span>📐 Ver fórmula</span><span>${open?'▲':'▼'}</span></div>
    ${open?`<div class="fml-body">
      <div class="fml-row"><div class="fml-k">Fórmula</div><div class="fml-v">${f.simbolica}</div></div>
      <div class="fml-row"><div class="fml-k">Sustitución con tus datos</div><div class="fml-v">${f.sustitucion}</div></div>
      <div class="fml-norma">${f.norma}</div>
      ${f.pendiente?`<div class="fml-pend">⚠ Pendiente de revisión — ${f.pendiente}</div>`:''}
    </div>`:''}
  </div>`;
}

function resultPanelHtml(mod){
  const res = mod.compute(ST.answers);

  const noteObj = typeof rr.note==='object' ? rr.note : {warn:false, txt:rr.note};
  return `
  <div class="rpanel" id="rpanel">
    <div class="rhd"><div class="led ${rr.sev} live"></div><div class="t">RESULTADO EN VIVO</div><div class="badge ${rr.sev}">${rr.badge}</div></div>
    <div class="rbig"><div class="lbl">${rr.big.lbl}</div><div class="val">${rr.big.val}<span class="u">${rr.big.u}</span></div><div class="sub">${rr.big.sub}</div></div>
    <div class="rrows">${rr.rows.map((row,i)=>`<div class="rrow ${i===0?'hi':''}"><div class="k">${row[0]}</div><div class="v">${row[1]}</div></div>`).join('')}</div>
    ${noteObj.txt?`<div class="rnote ${noteObj.warn?'warn':''}">${noteObj.txt}</div>`:''}
    ${formulaBoxHtml(mod, res)}
    ${mod.historial?`<div class="actbtn" onclick="App.saveToHistorial()">💾 Guardar en historial</div>`:''}
    <div class="actbtn" onclick="Memoria.open()">📄 Exportar a PDF</div>

}

/* ---- REFERENCIA: FACTORES DE CORRECCIÓN (Tablas 310-15(b)(2)(a) y 310-15(b)(3)(a)) ---- */
function renderFactoresRef(){
  const rowsTemp = FTEMP.map(t=>[t.t+' °C', fmt(t.f,2)]);
  const agrupRanges = [
    {r:'1 – 3', f:1.00}, {r:'4 – 6', f:0.80}, {r:'7 – 9', f:0.70},
    {r:'10 – 20', f:0.50}, {r:'21 – 30', f:0.45}, {r:'31 – 40', f:0.40}, {r:'41 o más', f:0.35}
  ];
  const rowsAgrup = agrupRanges.map(x=>[x.r, fmt(x.f,2)]);
  return `<div class="stage">
    <div class="refcard"><div class="inner" style="font-size:11px;color:var(--text2);line-height:1.5">🌡️ NOM-001-SEDE-2012. Ambos factores se aplican sobre la ampacidad base de Tabla 310-15(b)(16) @75°C, y se multiplican entre sí cuando ambas condiciones aplican: <b>Amp. corregida = Amp. base × F.temp × F.agrup</b>.</div></div>
    <div class="refcard"><h3>🌡️ Corrección por temperatura ambiente</h3><div class="inner">${rtable(['Temp. ambiente','Factor'], rowsTemp)}
      <div class="rnote" style="margin-top:8px">NOM-001 Tabla 310-15(b)(2)(a), columna de conductores 75°C (coincide con la base de ampacidad usada en este módulo). Si tu conductor tiene aislamiento 90°C, verifica la columna correspondiente en el texto oficial — los factores cambian.</div>
    </div></div>
    <div class="refcard"><h3>🔗 Factor de agrupamiento (conduit)</h3><div class="inner">${rtable(['N.º de conductores portadores de corriente','Factor'], rowsAgrup)}
      <div class="rnote" style="margin-top:8px">NOM-001 Tabla 310-15(b)(3)(a). Cuenta solo conductores portadores de corriente en el mismo conduit — no cuentan CPTE ni neutro sin corriente de retorno en cargas balanceadas. Este factor es independiente del cálculo de llenado de conduit (% de área ocupada), que solo verifica espacio físico. Este mismo factor aplica cuando varios circuitos comparten una charola — se cuentan TODOS los conductores portadores de corriente de TODOS los circuitos en esa charola, no solo los de un circuito.</div>
    </div></div>

    <div class="refcard"><h3>🗄️ Charola — Cables multiconductores</h3><div class="inner" style="font-size:11px;color:var(--text2);line-height:1.6">
      <b>Charola tipo escalera, malla o fondo ventilado (Art. 392-80(a)(1)):</b><br>
      Ampacidad base = Tabla 310-15(b)(16) (misma que en conduit). Si hay más de un cable multiconductor sin espacio entre ellos, se multiplica por el factor de agrupamiento de arriba (Tabla 310-15(b)(3)(a)) según el número total de conductores portadores de corriente.<br><br>
      <b>Charola de fondo sólido:</b><br>
      • Una sola capa, sin espaciamiento → factor <b>0.75</b> sobre Tabla 310-15(b)(16).<br>
      • Apilados o en más de una capa → <b style="color:var(--led-danger)">no existe factor directo de tabla</b> — la ampacidad se reduce bajo criterios especiales de diseño e inspección. No apliques un número genérico aquí.
    </div></div>

    <div class="refcard"><h3>🗄️ Charola — Conductores individuales (monoconductores)</h3><div class="inner">
      <div style="font-size:11px;color:var(--text2);line-height:1.6;margin-bottom:8px">
        Art. 392-80(a)(2), charola tipo escalera o ventilada, hasta 2000V.<br>
        • <b>Con espacio libre</b> ≥ diámetro del conductor mayor, una sola capa → ampacidad = Tabla 310-15(b)(17) directa (abajo).<br>
        • <b>Sin espacio libre</b>, una sola capa en contacto: charola tipo escalera → Tabla 310-15(b)(17) × <b>0.75</b>; charola ventilada de fondo liso → × <b>0.65</b>.
      </div>
      ${rtable(['Calibre','Cu 60°C','Cu 75°C','Cu 90°C','Al 60°C','Al 75°C','Al 90°C'], COND_AIRE.map(c=>[c.c, c.cu60+' A', c.cu75+' A', c.cu90+' A', c.al60?c.al60+' A':'—', c.al75?c.al75+' A':'—', c.al90?c.al90+' A':'—']))}
      <div class="rnote" style="margin-top:8px">NOM-001 Tabla 310-15(b)(17) — 30°C ambiente, 1 a 3 conductores aislados directamente al aire libre. Aluminio de 14 a 8 AWG: la tabla no da valor ("—"). Cobre 14/12/10 AWG: la tabla marca "**" — véase 240-4(d) para limitaciones de protección contra sobrecorriente. Se muestran solo los calibres más usados, no la tabla completa. No confundir con la Tabla 310-15(b)(16) (conduit) — los valores son mayores porque hay más disipación de calor al aire libre.</div>
    </div></div>

    <div class="refcard"><h3>⏱️ Continuidad de carga — 125%</h3><div class="inner" style="font-size:11px;color:var(--text2);line-height:1.6">
      NOM-001 Art. 210-19(a) y Art. 215-2. Para cargas continuas (operan a plena corriente 3 horas o más), el conductor y la protección se dimensionan al <b>125% de la corriente</b>, no al 100%.<br><br>
      <b>Ejemplo:</b> carga continua de 40 A → dimensiona conductor y breaker para 40 × 1.25 = <b>50 A</b>.<br>
      Es de los factores que más se pasan por alto en campo — no es opcional cuando la carga es continua.
    </div></div>

    <div class="refcard"><h3>🔌 Límite por terminales — 60°C / 75°C</h3><div class="inner" style="font-size:11px;color:var(--text2);line-height:1.6">
      NOM-001 Art. 110-14(c). El límite real de ampacidad casi siempre no lo pone el conductor sino la terminal del equipo (breaker, contactor, guardamotor).<br><br>
      • Circuitos ≤100 A o conductores 14-1 AWG → usa la columna de <b>60°C</b> de ampacidad, salvo que el equipo esté marcado explícitamente para 75°C o 90°C.<br>
      • Circuitos &gt;100 A o conductores 1/0 AWG y mayores → usa la columna de <b>75°C</b>, salvo marca explícita de 90°C.<br><br>
      Aunque tu conductor sea aislamiento 90°C, si la terminal del equipo es de 60°C o 75°C, la ampacidad de diseño se detiene en esa columna.
    </div></div>

    <div class="refcard"><h3>🔀 Conductores en paralelo</h3><div class="inner" style="font-size:11px;color:var(--text2);line-height:1.6">
      NOM-001 Art. 310-4. Al dividir una carga grande en 2, 3 o más conductores por fase (para evitar un calibre impráctico), cada conjunto debe cumplir:<br><br>
      • Mismo material (todo Cu o todo Al, sin mezclar).<br>
      • Mismo calibre y misma longitud en cada fase.<br>
      • Mismo tipo de aislamiento.<br>
      • Instalados juntos (mismo conduit/charola) o con el mismo arreglo físico en cada canalización paralela.<br>
      • El CPTE (tierra de equipo) se dimensiona por la protección del conjunto completo (Tabla 250-122), no se reparte ni se reduce por conductor individual.
    </div></div>

    <div class="refcard"><div class="inner" style="font-size:11px;color:var(--text2);line-height:1.5">📐 NOM-001-SEDE-2012 Art. 220. Los siguientes factores de demanda son para dimensionar la <b>carga total de la instalación</b> (acometida, alimentador principal) — no se aplican al dimensionar un circuito derivado individual. Su uso es más común en diseño comercial/residencial; en instalaciones industriales revisa si tu proyecto realmente cae en alguna de estas ocupaciones antes de aplicarlos.</div></div>

    <div class="refcard"><h3>📐 Factor de demanda — Alumbrado general</h3><div class="inner">${rtable(['Ocupación','Tramo','Factor'], DEM_ALUM.flatMap(g=>g.tramos.map((t,i)=>[i===0?g.ocup:'', t.r, t.f+'%'])))}
      <div class="rnote" style="margin-top:8px">NOM-001 Tabla 220-42.</div>
    </div></div>

    <div class="refcard"><h3>📐 Factor de demanda — Contactos no residenciales</h3><div class="inner">${rtable(['Carga (VA, a 180 VA/salida)','Factor'], DEM_CONT.map(x=>[x.r, x.f+'%']))}
      <div class="rnote" style="margin-top:8px">NOM-001 Tabla 220-44.</div>
    </div></div>

    <div class="refcard"><h3>📐 Factor de demanda — Estufas y equipo de cocina</h3><div class="inner">${rtable(['N.º equipos','Col. A (&lt;3.5 kW)','Col. B (3.5-8.75 kW)','Col. C máx. (8.75-12 kW)'], DEM_COCINA.map(x=>[x.n, x.a+'%', x.b+'%', x.c]))}
      <div class="rnote" style="margin-top:8px">NOM-001 Tabla 220-55. Aplica a equipos residenciales/comerciales ligeros mayores a 1.75 kW — poco frecuente en industrial, pero se incluye para instalaciones mixtas (comedor, cocineta de planta).</div>
    </div></div>
  </div>`;
}

/* ---- REFERENCIA: FLC MOTORES (Tabla 430-250 trifásicos / 430-248 monofásicos) ---- */
function renderFlcRef(){

  const rowsMono = MOTOR_FLC_MONO_DATA.map(m=>[m.hp+' HP', fmt(m.v115,1)+' A', fmt(m.v127,1)+' A', fmt(m.v208,1)+' A', fmt(m.v230,1)+' A']);
  return `<div class="stage">
    <div class="refcard"><h3>⚙️ FLC — Motores trifásicos CA</h3><div class="inner">${rtable(['HP','460V','230V','208V','575V'], rowsTri)}
      <div class="rnote" style="margin-top:8px">NOM-001 Tabla 430-250. Según la nota de la tabla, la columna 460V se permite para sistemas de 440 a 480V (la de 230V para 220 a 240V y la de 575V para 550 a 600V). "—" = casilla vacía en la tabla. 575V / 10 HP: el PDF imprime 44 A, incongruente con los renglones vecinos — no se usa (pendiente de verificar). Para dimensionar conductor (Art.430-22, ×1.25) y protección contra cortocircuito (Art.430-52) usa ESTE valor de tabla, NO el calculado ni el FLA de placa. El FLA de placa se usa solo para ajustar el guardamotor/relé térmico (Art.430-32).</div>
    </div></div>
    <div class="refcard"><h3>⚙️ FLC — Motores monofásicos CA</h3><div class="inner">${rtable(['HP','115V','127V','208V','230V'], rowsMono)}
      <div class="rnote" style="margin-top:8px">NOM-001 Tabla 430-248. Las columnas 115V y 230V son las nominales de norma (rango 110-120V y 220-240V respectivamente); 127V y 208V se incluyen por ser tensiones comunes en instalaciones mexicanas. Mismo criterio que trifásicos: usa este valor de tabla para conductor y protección, no el calculado.</div>
    </div></div>
  </div>`;
}

/* ---- REFERENCIA: CPTE — TIERRA DE EQUIPO (Tabla 250-122) ---- */

  return `<div class="stage">

    </div></div>
  </div>`;
}

/* ---- REFERENCIA: VFD ---- */
function vfdItemsHtml(){
  const f = ST.vfdFilter.trim().toUpperCase();
  const list = VFD_CODES.filter(v=> !f || v.code.includes(f) || v.name.toUpperCase().includes(f));
  return (list.map(v=>`
    <div class="vfd-item ${ST.vfdOpen[v.code]?'open':''}">
      <div class="vfd-head" onclick="App.toggleVfd('${v.code}')">
        <div class="code" style="color:${v.sev==='danger'?'var(--led-danger)':'var(--led-warn)'}">${v.code}</div>
        <div class="name">${v.name}</div><div style="color:var(--dim)">${ST.vfdOpen[v.code]?'▲':'▼'}</div>
      </div>
      <div class="vfd-body">
        <div class="sec">Causas</div>${v.causas}
        <div class="sec">Mediciones</div>${v.medic}
        ${v.param&&v.param!=='—'?`<div class="sec">Parámetros</div>${v.param}`:''}
        <div class="sec">Solución</div><b>${v.sol}</b>
      </div>
    </div>`).join('')) || '<div class="inner">Sin resultados.</div>';
}
function renderVfd(){
  return `<div class="stage">
    <div class="searchbar"><span>🔎</span><input placeholder="Buscar código o nombre…" value="${esc(ST.vfdFilter)}" oninput="App.setVfdFilter(this.value)"></div>

  </div>`;
}
function renderVfdListOnly(){ const el=document.getElementById('vfdlist'); if(el) el.innerHTML = vfdItemsHtml(); }

/* ---- REFERENCIA: CURVAS ---- */
function rtable(headers, rows, hideHead){
  return `<div class="rtable-wrap"><table class="rtable">${hideHead?'':`<thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>`}
  <tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function renderCurvas(){
  const cards = CURVAS.map(g=>`
    <div class="refcard"><h3>${g.ic} ${g.title}</h3>
    <div class="inner">
      <div style="font-size:11px;color:var(--text2);line-height:1.5;margin-bottom:8px">${g.intro}</div>
      ${rtable(g.headers,g.rows)}
      ${g.note?`<div class="rnote" style="margin-top:8px">${g.note}</div>`:''}
    </div></div>`).join('');
  return `<div class="stage">${cards}</div>`;
}

/* ---- HISTORIAL (piloto: solo módulos con historial:true — capacitores y UPS) ---- */
function renderHistorial(){
  const arr = Historial.listar();
  const items = arr.map(e=>{
    const mod = MODULES_A[e.modulo];
    const color = mod ? mod.tc : '#888';
    const fecha = new Date(e.fecha).toLocaleString('es-MX',{dateStyle:'short',timeStyle:'short'});
    return `
    <div class="refcard" style="border-left:2px solid ${color}">
      <div class="inner">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
          <div style="flex:1">
            <div style="font-size:11px;color:var(--text2)">${fecha} · ${e.moduloLabel}</div>
            ${e.nota?`<div style="font-weight:700;margin:2px 0">${escHtml(e.nota)}</div>`:''}
            <div style="font-size:12.5px;margin-top:4px">${escHtml(e.resumen)}</div>
          </div>
          <div onclick="App.deleteHistorialEntry('${e.id}')" style="padding:4px 8px;color:var(--led-danger);font-size:16px;cursor:pointer">🗑</div>
        </div>
        <div class="actbtn" style="margin:10px 0 0 0" onclick="App.loadHistorialEntry('${e.id}')">Ver / recargar →</div>
      </div>
    </div>`;
  }).join('');
  return `<div class="stage">
    ${arr.length===0?`<div class="refcard"><div class="inner" style="text-align:center;color:var(--text2);padding:20px 10px">Aún no guardas ningún cálculo.<br><br>Ve a Banco de Capacitores o UPS, calcula, y toca "💾 Guardar en historial".</div></div>`:items}
    ${arr.length>0?`<div class="refcard"><div class="inner"><div class="actbtn" onclick="App.exportHistorial()">⬇ Exportar historial (.json)</div></div></div>`:''}
    <div class="refcard"><div class="inner">
      <label class="actbtn" style="display:block">⬆ Importar historial
        <input type="file" accept=".json,application/json" style="display:none" onchange="App.importHistorial(this.files[0])">
      </label>
      <div style="font-size:10.5px;color:var(--text2);margin-top:8px;line-height:1.5">El historial vive en este navegador — comparte con unamano.html si están en el mismo sitio, pero no sincroniza con otro dispositivo. Usa exportar/importar para respaldar o mover.</div>
    </div></div>
  </div>`;
}

const MEMORIA_DEF = {

  caida: {

    ],
    pasos(r){
      const a=r.a, c=r.c, k=a.sistema==='tri'?Math.sqrt(3):2, Lkm=a.l/1000;
      return [
        {t:'Impedancia del conductor (Tabla 9)', l:[

          `Z = √(R² + XL²) = √(${fmt(c.r,3)}² + ${fmt(c.xl,3)}²) = ${fmt(r.Z,3)} Ω/km`]},
        {t:'Caída de tensión porcentual', l:[
          `k = ${a.sistema==='tri'?'√3 = '+fmt(k,3)+' (trifásico)':'2 (monofásico)'}   ·   L = ${fmt(a.l,1)} m = ${fmt(Lkm,4)} km`,
          `ΔV% = (k · I · L · Z) / Vn × 100`,
          `ΔV% = (${fmt(k,3)} × ${fmt(a.i,1)} × ${fmt(Lkm,4)} × ${fmt(r.Z,3)}) / ${fmt(a.vn,0)} × 100 = ${fmt(r.pct,2)} %`]},
        {t:'Caída en volts y tensión en la carga', l:[
          `ΔV = ΔV% × Vn / 100 = ${fmt(r.pct,2)} × ${fmt(a.vn,0)} / 100 = ${fmt(r.dV,2)} V`,
          `Vc = Vn − ΔV = ${fmt(a.vn,0)} − ${fmt(r.dV,2)} = ${fmt(r.Vc,1)} V`]},
        {t:'Verificación contra el límite', l:[
          `${fmt(r.pct,2)} % ${r.cumple?'≤':'>'} ${a.limite} %  →  ${r.cumple?'CUMPLE':'NO CUMPLE'}`]},
      ];
    },
    avisos(r){ return []; }   // el aviso de Z sale de formula().pendiente (misma redacción que en pantalla)
  },

  ampacidad: {
    normas:[
      'NOM-001-SEDE-2012, Tabla 310-15(b)(16) — ampacidad base (75 °C).',
      'Tabla 310-15(b)(2)(a) — factor de corrección por temperatura ambiente.',
      'Tabla 310-15(b)(3)(a) — factor de agrupamiento (conductores en conduit).',
      'Art. 392 — charolas (aquí solo se usa un factor simplificado).'
    ],
    pasos(r){
      const a=r.a;
      const inst = a.inst==='conduit' ? `Conduit con ${a.n} conductores → F.inst = ${fmt(r.Finst,2)}  (agrupamiento)`
                 : a.inst==='esc' ? `Charola escalerilla → F.inst = ${fmt(r.Finst,2)}  (factor simplificado)`
                 : `Charola lisa → F.inst = ${fmt(r.Finst,2)}  (factor simplificado)`;
      let prev=null, hit=null, last=null;
      for(const c of COND){
        const base = a.mat==='cu'?c.cu:c.al; if(!base) continue;
        const raw = base*r.Ftemp*r.Finst;
        const lim = (a.mat==='cu' && c.cap) ? Math.min(raw,c.cap) : raw;   // Art. 240-4(d)
        last = {c,base,raw,corr:lim,topado:lim<raw};
        if(last.corr>=a.i){ hit=last; break; }
        prev = last;
      }
      const ln = (x,ok)=>`${x.c.c}: ${x.base} × ${fmt(r.Ftemp,2)} × ${fmt(r.Finst,2)} = ${fmt(x.raw,1)} A${x.topado?' → topada a '+x.c.cap+' A (Art. 240-4(d))':''}  ${ok?'≥':'<'}  ${fmt(a.i,1)} A  →  ${ok?'CUMPLE (calibre mínimo)':'no cumple'}`;
      const busq = [];
      if(prev && prev!==last) busq.push(ln(prev,false));
      if(hit) busq.push(ln(hit,true));
      else if(last) busq.push(`${last.c.c} (mayor de la tabla): ${fmt(last.corr,1)} A < ${fmt(a.i,1)} A  →  sin calibre en tabla; considerar conductores en paralelo (Art. 310-4)`);
      return [
        {t:'Factores de corrección', l:[
          `Temperatura ambiente ${a.temp} °C → F.temp = ${fmt(r.Ftemp,2)}`, inst]},
        {t:`Búsqueda del calibre (${a.mat==='cu'?'cobre':'aluminio'})`, l:[
          `I corregida = I base × F.temp × F.inst  ≥  I diseño (${fmt(a.i,1)} A)`, ...busq]},
      ];
    },
    avisos(r){
      const out=[], a=r.a, p=r.pick;
      if(a.inst!=='conduit') out.push('Verificación pendiente — charola: se usó un factor fijo simplificado (0.75 escalerilla / 0.65 lisa) sobre la Tabla 310-15(b)(16). Para charola la base de ampacidad es la Tabla 310-15(b)(17) y el Art. 392 fija condiciones y calibre mínimo (1/0 AWG en el caso general). No uses este resultado como definitivo en charola sin verificar en el texto oficial.');
      return out;
    }
  },

  motor: {

  conduit: {

      'Capítulo 10, Tabla 4 — diámetro interior del conduit por tipo y tamaño.',

          `φ2 = arccos(${fmt(a.fp2,2)}) = ${fmt(phi2*rad,2)}°  →  tan φ2 = ${fmt(t2,4)}`]},
        {t:'Potencia reactiva a compensar', l:[
          `Q = P × (tan φ1 − tan φ2) = ${fmt(a.kw,1)} × (${fmt(t1,4)} − ${fmt(t2,4)}) = ${fmt(r.kvarNecesarios,2)} kVAR`,
          `Banco comercial: ${fmt(r.kvarComercial,1)} kVAR`]},
        {t:'Corriente de línea antes y después', l:[
          `S antes = P / FP1 = ${fmt(a.kw,1)} / ${fmt(a.fp1,2)} = ${fmt(r.kvaAntes,1)} kVA   →   I = S·1000 / (√3 · V) = ${fmt(r.iAntes,1)} A`,
          `S después = P / FP2 = ${fmt(a.kw,1)} / ${fmt(a.fp2,2)} = ${fmt(r.kvaDespues,1)} kVA   →   I = ${fmt(r.iDespues,1)} A`,
          `Reducción = (1 − ${fmt(r.iDespues,1)} / ${fmt(r.iAntes,1)}) × 100 = ${fmt(r.reduccion,1)} %`]},
        {t:'FP real con el banco comercial', l:[
          `Q residual = P × tan φ1 − Q banco = ${fmt(a.kw*t1,2)} − ${fmt(r.kvarComercial,1)} = ${fmt(resid,2)} kVAR`,
          `FP real = P / √(P² + Q²) = ${fmt(r.fpReal,3)}`]},
      ];
    },
    avisos(r){
      const out=[];
      if(r.kvarNecesarios<=0) out.push('El FP actual ya es igual o mayor al deseado: no se requiere banco. El valor comercial mostrado es solo el mínimo de la tabla, no una recomendación.');
      return out;
    }
  },

  ups: {
    normas:['Cálculo de ingeniería (capacidad y autonomía). Este módulo no cita un artículo específico de la NOM-001-SEDE.'],
    pasos(r){
      const a=r.a, vaM=r.vaCarga*(1+a.margen);
      const p=[
        {t:'Capacidad del UPS', l:[
          `VA de carga = W / FP = ${fmt(a.w,0)} / ${fmt(a.fpc,2)} = ${fmt(r.vaCarga,0)} VA`,
          `Con margen = ${fmt(r.vaCarga,0)} × (1 + ${fmt(a.margen,2)}) = ${fmt(vaM,0)} VA = ${fmt(vaM/1000,3)} kVA  →  comercial ${r.kvaRecomendado} kVA`]},
      ];
      if(a.modo==='auto'){
        p.push({t:'Autonomía', l:[`t = (Ah × Vdc × k_bat × η / W) × 60 = (${fmt(a.ah,1)} × ${fmt(a.vdc,0)} × ${fmt(a.bat,2)} × ${fmt(a.eta,2)} / ${fmt(a.w,0)}) × 60 = ${fmt(r.autoninMin,1)} min`]});
      } else {
        p.push({t:'Ah necesarios', l:[`Ah = W × (t/60) / (Vdc × k_bat × η) = ${fmt(a.w,0)} × (${fmt(a.tmin,0)}/60) / (${fmt(a.vdc,0)} × ${fmt(a.bat,2)} × ${fmt(a.eta,2)}) = ${fmt(r.ahNecesarios,1)} Ah`]});
      }
      p.push({t:'Corriente de descarga', l:[`I = (W / η) / Vdc = (${fmt(a.w,0)} / ${fmt(a.eta,2)}) / ${fmt(a.vdc,0)} = ${fmt(r.iDescarga,2)} A`]});
      return p;
    },
    avisos(r){ return ['El factor de batería (0.5 plomo-ácido / 0.8 litio) y la eficiencia del inversor son valores de diseño; confirma con la hoja de datos del fabricante.']; }
  }
};

const Memoria = {
  KEY:'voltrefmx_encabezado',
  PERSIST:['proyecto','cliente','elaboro','reviso'],   // lo demás es propio de cada documento
  data:{proyecto:'', cliente:'', area:'', elaboro:'', reviso:'', fecha:'', folio:'', notas:''},
  _title:document.title,

  init(){
    try{ const j=JSON.parse(localStorage.getItem(this.KEY)||'{}'); this.PERSIST.forEach(k=>{ if(typeof j[k]==='string') this.data[k]=j[k]; }); }catch(e){}
    window.addEventListener('afterprint', ()=>{ document.title=this._title; });
    document.addEventListener('keydown', e=>{ if(e.key==='Escape' && this.root().innerHTML) this.close(); });
  },
  save(){ try{ const o={}; this.PERSIST.forEach(k=>o[k]=this.data[k]); localStorage.setItem(this.KEY, JSON.stringify(o)); }catch(e){} },
  root(){ return document.getElementById('memo-root'); },
  hoy(){ return new Date().toLocaleDateString('es-MX',{day:'2-digit',month:'2-digit',year:'numeric'}); },
  toast(msg){ const t=document.createElement('div'); t.className='memo-toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2800); },
  set(k,v){ this.data[k]=v; },

  valid(mod){
    return App.activeFields(mod).every(f=>{ if(f.type!=='number') return true; const v=ST.answers[f.key]; return typeof v==='number' && isFinite(v); });
  },

  open(){
    const mod=MODULES_A[ST.modId]; if(!mod) return;
    if(!this.valid(mod)){ this.toast('Completa todos los campos numéricos antes de exportar.'); return; }
    this.data.fecha=this.hoy(); this.data.area=''; this.data.folio=''; this.data.notas='';
    this.showForm();
  },
  close(){ this.root().innerHTML=''; document.title=this._title; },
  clear(){ Object.keys(this.data).forEach(k=>{ this.data[k]=''; }); this.save(); this.showForm(); },

  showForm(){
    const d=this.data;
    const inp=(k,label,extra)=>`<div class="memo-lbl">${label}</div><input class="memo-in" type="text" autocomplete="off" autocapitalize="sentences" value="${esc(d[k])}" oninput="Memoria.set('${k}',this.value)" ${extra||''}>`;
    this.root().innerHTML = `
    <div class="memo-modal" onclick="if(event.target===this)Memoria.close()">
      <div class="memo-card">
        <div class="memo-hd"><div class="t">📄 Encabezado de la memoria</div><div class="x" onclick="Memoria.close()">✕</div></div>
        <div class="memo-sub">Escribe lo que necesites en cada campo. Lo que dejes vacío sale como línea en blanco para llenarlo a mano.</div>
        <div class="memo-body">
          ${inp('proyecto','PROYECTO / OBRA')}
          ${inp('cliente','CLIENTE / EMPRESA')}
          ${inp('area','ÁREA, EQUIPO O CIRCUITO')}
          <div class="memo-row2">
            <div>${inp('elaboro','ELABORÓ')}</div>
            <div>${inp('reviso','REVISÓ (OPCIONAL)')}</div>
          </div>
          <div class="memo-row2">
            <div>${inp('fecha','FECHA')}</div>
            <div>${inp('folio','FOLIO / REV. (OPCIONAL)')}</div>
          </div>
          <div class="memo-lbl">NOTAS U OBSERVACIONES (OPCIONAL)</div>
          <textarea class="memo-in" oninput="Memoria.set('notas',this.value)">${esc(d.notas)}</textarea>
        </div>
        <div class="memo-actions">
          <div class="memo-btn" onclick="Memoria.clear()">Limpiar</div>
          <div class="memo-btn primary" onclick="Memoria.preview()">Vista previa →</div>
        </div>
      </div>
    </div>`;
  },

  preview(){
    const mod=MODULES_A[ST.modId]; if(!mod) return;
    if(!this.valid(mod)){ this.toast('Completa todos los campos numéricos antes de exportar.'); return; }
    this.save();
    const res=mod.compute(ST.answers);
    this.root().innerHTML = `
    <div class="memo-preview">
      <div class="memo-toolbar">
        <div class="memo-btn" onclick="Memoria.showForm()">← Editar</div>
        <div class="memo-btn primary" onclick="Memoria.print()">🖨 Imprimir / Guardar PDF</div>
        <div class="memo-btn" onclick="Memoria.close()">✕</div>
      </div>
      <div class="memo-hint">En el diálogo de impresión elige <b>Guardar como PDF</b> como destino. Si no se abre, usa el menú del navegador → Imprimir.</div>
      <div class="memo-paper" id="memo-paper">${this.sheetHtml(mod,res)}</div>
    </div>`;
    const sc=this.root().querySelector('.memo-preview'); if(sc) sc.scrollTop=0;
  },

  print(){
    const mod=MODULES_A[ST.modId]; const d=this.data;
    const nombre=['VoltRefMX','Memoria',mod?mod.label:'',d.proyecto].filter(Boolean).join('_').replace(/[^\wáéíóúñÁÉÍÓÚÑ\-]+/g,'_').replace(/_+/g,'_');
    document.title=nombre;
    try{ window.print(); }catch(e){ this.toast('Usa el menú del navegador → Imprimir → Guardar como PDF'); }
  },

  // Filas de "datos de entrada" tomadas de los mismos campos de la calculadora (etiqueta, valor mostrado, unidad)
  inputRows(mod,a){
    return App.activeFields(mod).map(f=>{
      let v='', u='';
      if(f.type==='number'){ v=fmt(a[f.key],3); u=typeof f.unit==='function'?f.unit(a):(f.unit||''); }
      else if(f.type==='segment' || f.type==='choice'){ const o=f.options.find(o=>o.v===a[f.key]); v=o?o.l:String(a[f.key]); }
      else if(f.type==='select'){ const opts=typeof f.opts==='function'?f.opts(a):f.opts; const o=opts.find(o=>String(o.v)===String(a[f.key])); v=o?o.l:String(a[f.key]); }
      return [f.label, v, u];
    });
  },

  sheetHtml(mod,res){
    const d=this.data, def=MEMORIA_DEF[mod.id], rr=mod.renderResult(res);
    const noteObj = (rr.note && typeof rr.note==='object') ? rr.note : {warn:false, txt:rr.note||''};
    const ahora = new Date().toLocaleString('es-MX',{dateStyle:'short',timeStyle:'short'});
    const cell = (label,v,cls)=>`<div class="mp-cell ${cls||''}"><div class="mp-cl">${label}</div><div class="mp-cv">${(v&&String(v).trim())?esc(v):'&nbsp;'}</div></div>`;

    const inRows = this.inputRows(mod,res.a).map(([k,v,u])=>`<tr><td>${esc(k)}</td><td class="r">${esc(v)}</td><td class="u">${esc(u)}</td></tr>`).join('');
    const fml = mod.formula ? mod.formula(res) : null;
    const fmlHtml = fml ? `<div class="mp-step"><div class="mp-st">Fórmula aplicada</div><div class="mp-fl">${fml.simbolica}</div></div>` : '';
    const pasos  = def.pasos(res).map((p,i)=>`<div class="mp-step"><div class="mp-st">${i+1}. ${esc(p.t)}</div>${p.l.map(x=>`<div class="mp-fl">${esc(x)}</div>`).join('')}</div>`).join('');
    const rRows  = rr.rows.map(row=>`<tr><td>${esc(row[0])}</td><td class="r">${esc(row[1])}</td></tr>`).join('');
    const normas = def.normas.map(n=>`<li>${esc(n)}</li>`).join('');

    const avisos=[]; if(noteObj.warn && noteObj.txt) avisos.push(noteObj.txt);
    if(fml && fml.pendiente) avisos.push('Pendiente de revisión — '+fml.pendiente);
    def.avisos(res).forEach(x=>avisos.push(x));
    const notaSimple = (!noteObj.warn && noteObj.txt) ? noteObj.txt : '';

    return `
    <div class="mp-top">
      <div><div class="mp-title">MEMORIA DE CÁLCULO</div><div class="mp-sub">${esc(mod.label)} — ${esc(mod.desc)}</div></div>
      <div class="mp-brand"><b>VOLTREF·MX</b><br>Tablero de control</div>
    </div>
    <div class="mp-meta">
      ${cell('Proyecto / obra', d.proyecto)}
      ${cell('Fecha', d.fecha)}
      ${cell('Cliente / empresa', d.cliente)}
      ${cell('Folio / rev.', d.folio)}
      ${cell('Área, equipo o circuito', d.area, 'full')}
    </div>

    <div class="mp-sec"><div class="mp-h">1 · Datos de entrada</div><table class="mp-t">${inRows}</table></div>
    <div class="mp-sec" style="page-break-inside:auto;break-inside:auto"><div class="mp-h">2 · Desarrollo del cálculo</div>${fmlHtml}${pasos}</div>
    <div class="mp-sec">
      <div class="mp-h">3 · Resultado</div>
      <div class="mp-result ${rr.sev}">
        <div><div class="mp-rl">${esc(rr.big.lbl)}</div><div class="mp-rv">${esc(rr.big.val)}<span>${esc(rr.big.u)}</span></div><div class="mp-rs">${esc(rr.big.sub)}</div></div>
        <div class="mp-badge ${rr.sev}">${esc(rr.badge)}</div>
      </div>
      <table class="mp-t">${rRows}</table>
      ${notaSimple?`<div class="mp-note">${esc(notaSimple)}</div>`:''}
    </div>
    <div class="mp-sec"><div class="mp-h">4 · Referencias normativas</div><ul class="mp-list">${normas}</ul></div>
    ${avisos.length?`<div class="mp-sec"><div class="mp-h">5 · Advertencias y verificación pendiente</div><div class="mp-warn">${avisos.map((x,i)=>`<p><b>⚠</b> ${esc(String(x).replace(/^\s*⚠\s*/,''))}</p>`).join('')}</div></div>`:''}
    ${(d.notas&&d.notas.trim())?`<div class="mp-sec"><div class="mp-h">${avisos.length?'6':'5'} · Notas u observaciones</div><div class="mp-usernote">${esc(d.notas)}</div></div>`:''}

    <div class="mp-sign">
      <div class="mp-sline"><b>${esc((d.elaboro||'').trim())||'&nbsp;'}</b>Elaboró</div>
      <div class="mp-sline"><b>${esc((d.reviso||'').trim())||'&nbsp;'}</b>Revisó</div>
    </div>
    <div class="mp-foot">Generado con VoltRefMX · Tablero (${esc(APP_VERSION)}) · ${esc(ahora)} — Herramienta de apoyo: verifica los valores contra el texto oficial de la NOM-001-SEDE-2012 antes de usar este documento para diseño o verificación de la instalación.</div>`;
  }
};
window.Memoria = Memoria;
Memoria.init();

render();
setInterval(()=>{ const c=document.getElementById('clockslot'); if(c) c.textContent=clockStr(); }, 15000);

</script>
