<style>
/* ===== TEMA CLARO (por defecto) — "papel de ingeniería" con acento fósforo ===== */
:root{
  --bg:#f3f6f1; --panel:#ffffff; --panel2:#eef2ea; --panel3:#e2e9dc;
  --line:#d3ddc9; --line2:#c1cdb5;
  --text:#16241a; --text2:#4d5c47; --dim:#8b9884;
  --accent:#0e8a3f; --accent-dim:rgba(14,138,63,.10); --accent-bdr:rgba(14,138,63,.35);
  --led-ok:#0e8a3f; --led-ok-bg:rgba(14,138,63,.10);
  --led-warn:#a66c00; --led-warn-bg:rgba(166,108,0,.10);
  --led-danger:#c0362c; --led-danger-bg:rgba(192,54,44,.10);
  --grid-line:rgba(14,138,63,.07);
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  --mono:'SF Mono','JetBrains Mono',ui-monospace,'Cascadia Code',Consolas,monospace;
  --sans:-apple-system,'Segoe UI',system-ui,sans-serif;
}
/* ===== TEMA OSCURO — fósforo verde sobre negro, tipo radar/osciloscopio ===== */
body.theme-dark{
  --bg:#040a06; --panel:#08120b; --panel2:#0d1a11; --panel3:#132818;
  --line:rgba(57,255,140,.16); --line2:rgba(57,255,140,.28);
  --text:#daffe9; --text2:#7fcf9c; --dim:#3d6b4d;
  --accent:#39ff88; --accent-dim:rgba(57,255,136,.12); --accent-bdr:rgba(57,255,136,.35);
  --led-ok:#39ff88; --led-ok-bg:rgba(57,255,136,.12);
  --led-warn:#ffcc33; --led-warn-bg:rgba(255,204,51,.12);
  --led-danger:#ff5c5c; --led-danger-bg:rgba(255,92,92,.12);
  --grid-line:rgba(57,255,136,.05);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text); font-family:var(--mono);
  overflow:hidden; position:fixed; inset:0; font-size:13px; transition:background .2s, color .2s;
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size:22px 22px;
}
input,select,button{font-family:inherit;}
#app{position:absolute; inset:0; display:flex; flex-direction:column;}

@keyframes ledpulse{0%,100%{opacity:1} 50%{opacity:.4}}
.led{width:7px; height:7px; border-radius:50%; flex-shrink:0; box-shadow:0 0 6px currentColor;}
.led.ok{background:var(--led-ok); color:var(--led-ok);}
.led.warn{background:var(--led-warn); color:var(--led-warn);}
.led.danger{background:var(--led-danger); color:var(--led-danger);}
.led.idle{background:var(--dim); color:var(--dim); box-shadow:none;}
.led.live{animation:ledpulse 1.6s ease-in-out infinite;}

/* ===== TOP STATUS BAR ===== */
.statusbar{
  flex-shrink:0; padding: calc(8px + var(--safe-t)) 12px 8px;
  display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--line);
  background:linear-gradient(180deg, var(--panel2), var(--panel));
}
.sb-menu{width:34px; height:34px; border-radius:6px; border:1px solid var(--line2); background:var(--panel3);
  display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; color:var(--accent);}
.sb-menu:active{background:var(--panel2);}
.sb-brand{font-weight:800; font-size:13px; letter-spacing:.06em; color:var(--text);}
.sb-brand b{color:var(--accent);}
.sb-sub{font-size:9.5px; color:var(--dim); letter-spacing:.1em; margin-top:1px;}
.sb-status{margin-left:auto; display:flex; align-items:center; gap:6px; font-size:10px; color:var(--led-ok); letter-spacing:.08em;}
.sb-clock{font-size:10px; color:var(--dim); margin-left:8px;}
.sb-theme{width:30px; height:30px; border-radius:6px; border:1px solid var(--line2); background:var(--panel3);
  display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; margin-left:6px; color:var(--text2);}
.sb-theme:active{background:var(--panel2);}

/* ===== SIDEBAR (drawer) ===== */
.overlay{position:absolute; inset:0; background:rgba(0,0,0,.55); z-index:20; opacity:0; pointer-events:none; transition:opacity .2s;}
.overlay.open{opacity:1; pointer-events:auto;}
.sidebar{
  position:absolute; top:0; bottom:0; left:0; width:250px; z-index:21;
  background:var(--panel2); border-right:1px solid var(--line);
  transform:translateX(-100%); transition:transform .22s ease; display:flex; flex-direction:column;
  padding-top:var(--safe-t); padding-bottom:var(--safe-b);
}
.sidebar.open{transform:translateX(0);}
.sb-head{padding:16px 16px 12px; border-bottom:1px solid var(--line);}
.sb-head .l1{font-size:9.5px; letter-spacing:.16em; color:var(--dim); font-weight:800;}
.sb-head .l2{font-size:15px; font-weight:800; margin-top:3px;}
.sb-group{padding:12px 10px 4px; font-size:9.5px; letter-spacing:.14em; color:var(--dim); font-weight:800;}
.sb-item{
  display:flex; align-items:center; gap:10px; padding:11px 12px; margin:1px 6px; border-radius:7px;
  color:var(--text2); font-size:12.5px;
}
.sb-item .ic{width:18px; text-align:center; font-size:13px;}
.sb-item.active{background:var(--accent-dim); color:var(--accent); border:1px solid var(--accent-bdr);}
.sb-item.active .led{background:var(--accent); box-shadow:0 0 6px var(--accent);}
.sb-item:not(.active){border:1px solid transparent;}
.sb-item:active{background:var(--panel3);}
.sb-item .lbl{flex:1;}

/* ===== MAIN STAGE ===== */
.stage{flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:calc(14px + var(--safe-b));}
.stage::-webkit-scrollbar{display:none;}

/* ===== DASHBOARD HOME ===== */
.dash-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:10px 10px 4px;}
.dash-tile{
  background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:12px 10px;
  display:flex; flex-direction:column; gap:8px; min-height:88px;
}
.dash-tile:active{background:var(--panel3); border-color:var(--line2);}
.dash-tile .row1{display:flex; align-items:center; justify-content:space-between;}
.dash-tile .ic{font-size:18px;}
.dash-tile .name{font-size:11.5px; font-weight:700; color:var(--text); line-height:1.25;}
.dash-tile .sub{font-size:9.5px; color:var(--dim); font-family:var(--mono); letter-spacing:.03em;}
.panel-hd{padding:12px 14px 4px; display:flex; align-items:center; gap:8px;}
.panel-hd .t{font-size:10px; letter-spacing:.14em; color:var(--dim); font-weight:800;}
.panel-hd .line{flex:1; height:1px; background:var(--line);}

/* ===== FORM PANEL (módulo activo) ===== */
.modhead{
  padding:12px 14px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--line);
  background:var(--panel2); position:sticky; top:0; z-index:2;
}
.modhead .ic{width:32px; height:32px; border-radius:7px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;}
.modhead .t1{font-size:14px; font-weight:800;}
.modhead .t2{font-size:9.5px; color:var(--dim); letter-spacing:.04em;}

.fpanel{margin:10px 12px; background:var(--panel2); border:1px solid var(--line); border-radius:9px; overflow:hidden;}
.fpanel .fhd{padding:9px 12px; font-size:10px; letter-spacing:.12em; color:var(--dim); font-weight:800; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:7px;}
.frow{display:flex; align-items:center; gap:10px; padding:11px 12px; border-top:1px solid var(--line);}
.frow:first-of-type{border-top:none;}
.frow .flabel{flex:0 0 108px; font-size:11.5px; color:var(--text2);}
.frow .fctrl{flex:1; display:flex; align-items:center; gap:6px; min-width:0;}
.fnum{
  flex:1; background:var(--panel); border:1px solid var(--line2); border-radius:6px; padding:8px 10px;
  color:var(--accent); font-family:var(--mono); font-size:14px; font-weight:700; text-align:right; min-width:0;
}
.fnum:focus{outline:none; border-color:var(--accent);}
.funit{font-size:10px; color:var(--dim); width:34px; flex-shrink:0;}
.fstep{width:28px; height:28px; border-radius:6px; background:var(--panel3); border:1px solid var(--line2); color:var(--text2); font-size:15px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.fstep:active{background:var(--panel);}
.fseg{display:flex; flex:1; background:var(--panel); border-radius:6px; border:1px solid var(--line2); overflow:hidden;}
.fseg .o{flex:1; text-align:center; padding:8px 4px; font-size:11px; color:var(--text2); font-weight:700;}
.fseg .o.active{background:var(--accent-dim); color:var(--accent);}
.fselect{flex:1; background:var(--panel); border:1px solid var(--line2); border-radius:6px; padding:8px 10px; color:var(--text); font-size:12.5px; appearance:none; font-family:var(--mono);}
.fchoice-row{display:flex; flex-wrap:wrap; gap:6px; flex:1;}
.fchoice{padding:7px 11px; border-radius:6px; background:var(--panel); border:1px solid var(--line2); font-size:11px; color:var(--text2); font-weight:700;}
.fchoice.active{background:var(--accent-dim); color:var(--accent); border-color:var(--accent-bdr);}

/* ===== RESULT PANEL (live) ===== */
.rpanel{margin:10px 12px 16px; background:var(--panel2); border:1px solid var(--accent-bdr); border-radius:9px; overflow:hidden; box-shadow:0 0 0 1px rgba(0,0,0,.02), 0 8px 24px rgba(0,0,0,.35);}
.rpanel .rhd{padding:9px 12px; display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--line); background:rgba(0,0,0,.02);}
.rpanel .rhd .t{font-size:10px; letter-spacing:.14em; color:var(--accent); font-weight:800; flex:1;}
.rpanel .rhd .badge{font-size:9.5px; padding:3px 8px; border-radius:5px; font-weight:800; letter-spacing:.03em;}
.rpanel .rhd .badge.ok{background:var(--led-ok-bg); color:var(--led-ok);}
.rpanel .rhd .badge.warn{background:var(--led-warn-bg); color:var(--led-warn);}
.rpanel .rhd .badge.danger{background:var(--led-danger-bg); color:var(--led-danger);}
.rbig{padding:16px 14px 10px; text-align:center;}
.rbig .lbl{font-size:9.5px; letter-spacing:.12em; color:var(--dim); font-weight:800;}
.rbig .val{font-size:38px; font-weight:800; margin-top:4px; color:var(--text); font-variant-numeric:tabular-nums;}
.rbig .val .u{font-size:16px; color:var(--dim); margin-left:3px;}
.rbig .sub{font-size:11px; color:var(--text2); margin-top:4px;}
.rrows{padding:2px 12px 12px;}
.rrow{display:flex; justify-content:space-between; align-items:center; padding:8px 2px; border-top:1px solid var(--line); font-size:11.5px;}
.rrow:first-child{border-top:none;}
.rrow .k{color:var(--dim);}
.rrow .v{font-weight:700; color:var(--text);}
.rrow.hi .v{color:var(--accent);}
.rnote{margin:0 12px 4px 12px; padding:10px 11px; font-size:10.5px; color:var(--text2); line-height:1.55; background:var(--panel); border-left:2px solid var(--line2); border-radius:0 6px 6px 0;}
.rnote.warn{border-left-color:var(--led-warn); background:var(--led-warn-bg);}
.actbtn{margin:0 12px 12px 12px; padding:12px; text-align:center; font-weight:700; font-size:13px; color:var(--accent); background:var(--accent-dim); border:1px solid var(--accent-bdr); border-radius:8px;}
.actbtn:active{opacity:.75;}

/* ===== REF TABLES ===== */
.refcard{margin:10px 12px; background:var(--panel2); border:1px solid var(--line); border-radius:9px; overflow:hidden;}
.refcard h3{margin:0; padding:10px 12px; font-size:12px; font-weight:800; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px;}
.refcard .inner{padding:10px 12px;}
.rtable-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -12px; padding:0 12px;}
.rtable{width:100%; min-width:max-content; border-collapse:collapse; font-size:11.5px;}
.rtable th{text-align:left; font-size:9.5px; letter-spacing:.06em; color:var(--dim); font-weight:800; padding:0 12px 7px 0; white-space:nowrap;}
.rtable td{padding:8px 12px 8px 0; border-top:1px solid var(--line); color:var(--text2); white-space:nowrap;}
.rtable td:first-child{color:var(--text); font-weight:700;}
.swatchrow{display:flex; align-items:center; gap:9px; padding:7px 0; border-top:1px solid var(--line);}
.swatchrow:first-child{border-top:none;}
.swatch{width:20px; height:20px; border-radius:4px; border:1px solid rgba(255,255,255,.12); flex-shrink:0;}
.swatchrow .l{flex:1; font-size:11.5px; font-weight:700;}
.swatchrow .r{font-size:10px; color:var(--dim);}
.vfd-item{border-top:1px solid var(--line);}
.vfd-item:first-child{border-top:none;}
.vfd-head{display:flex; align-items:center; gap:10px; padding:11px 12px;}
.vfd-head .code{font-size:13px; font-weight:800; width:44px; flex-shrink:0;}
.vfd-head .name{flex:1; font-size:11.5px; color:var(--text2);}
.vfd-body{padding:0 12px 12px; font-size:11px; color:var(--text2); line-height:1.6; display:none;}
.vfd-item.open .vfd-body{display:block;}
.vfd-body b{color:var(--text);}
.vfd-body .sec{margin-top:8px; font-size:9.5px; letter-spacing:.08em; color:var(--dim); font-weight:800;}
.searchbar{display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--line2); border-radius:7px; padding:8px 11px; margin:10px 12px;}
.searchbar input{flex:1; background:transparent; border:none; color:var(--text); font-size:12.5px; outline:none;}
.loto-step{display:flex; gap:10px; padding:10px 0; border-top:1px solid var(--line);}
.loto-step:first-child{border-top:none;}
.loto-num{width:22px; height:22px; border-radius:50%; background:var(--accent-dim); border:1px solid var(--accent-bdr); color:var(--accent); font-weight:800; font-size:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.loto-verb{font-size:11.5px; font-weight:800;}
.loto-desc{font-size:10.5px; color:var(--dim); margin-top:2px; line-height:1.5;}
.subhead{font-size:10.5px; font-weight:800; margin:12px 0 6px; color:var(--text2);}

.hidden{display:none !important;}

/* ===== ADAPTACIÓN A PANTALLA ANCHA (laptop/escritorio) =====
   En celular, statusbar/modhead/stage ocupan todo el ancho por diseño.
   En pantallas anchas eso los estira demasiado y el texto se ve chico
   en proporción. Aquí se limita el ancho y se centra, sin tocar fuentes
   ni lógica — el sidebar sigue abriendo sobre toda la pantalla igual. */
@media (min-width:701px){
  #app{ align-items:center; }
  #app > .statusbar,
  #app > .modhead,
  #app > .stage{
    width:100%;
    max-width:640px;
  }
}
</style>

function fmt(n,d){ if(n===null||n===undefined||isNaN(n)) return '—'; d=d===undefined?2:d; return Number(n).toLocaleString('es-MX',{minimumFractionDigits:0,maximumFractionDigits:d}); }
// Escapa comillas en valores embebidos en atributos onclick/value (ej. tamaños de conduit tipo 1/2")
function escJs(v){ return String(v).replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
// Escapa texto libre (ej. nota del historial) antes de insertarlo como contenido HTML
function escHtml(v){ return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Historial de cálculos — localStorage. Comparte origen con unamano.html si están en el mismo sitio.
const Historial = {
  KEY: 'voltrefmx_historial',
  listar(){ try{ return JSON.parse(localStorage.getItem(this.KEY)||'[]'); }catch(e){ return []; } },
  guardar(entry){ const arr=this.listar(); arr.unshift(entry); localStorage.setItem(this.KEY, JSON.stringify(arr)); },
  eliminar(id){ const arr=this.listar().filter(e=>e.id!==id); localStorage.setItem(this.KEY, JSON.stringify(arr)); },
  exportar(){ return JSON.stringify(this.listar(), null, 2); },
  importar(json){ try{ const arr=JSON.parse(json); if(Array.isArray(arr)){ localStorage.setItem(this.KEY, JSON.stringify(arr)); return true; } }catch(e){} return false; }
};
function esc(s){ return (s+'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  caps: {
    id:'caps', label:'Banco de Capacitores', ic:'⚡', tc:'#eab308', tcbg:'rgba(234,179,8,.12)',
    desc:'Corrección de FP', historial:true,
    fields:[
      {key:'kw', type:'number', label:'Potencia activa', unit:'kW', min:1, max:5000, step:1, default:100},
      {key:'fp1', type:'number', label:'FP actual', unit:'', min:0.5, max:0.99, step:0.01, default:0.80},
      {key:'fp2', type:'segment', label:'FP deseado', options:[{v:0.90,l:'0.90'},{v:0.95,l:'0.95'},{v:1.00,l:'1.00'}], default:0.95},
      {key:'v', type:'number', label:'Tensión sistema', unit:'V', min:110, max:15000, step:1, default:440},
      {key:'vfd', type:'segment', label:'¿VFDs en la red?', options:[{v:'no',l:'No'},{v:'si',l:'Sí'}], default:'no'},
    ],
    compute(a){
      const phi1 = Math.acos(a.fp1), phi2 = Math.acos(a.fp2);
      const kvarNecesarios = a.kw*(Math.tan(phi1)-Math.tan(phi2));
      const kvarComercial = roundStdKvar(kvarNecesarios);
      const kvaAntes = a.kw/a.fp1, kvaDespues = a.kw/a.fp2;
      const iAntes = kvaAntes*1000/(Math.sqrt(3)*a.v);
      const iDespues = kvaDespues*1000/(Math.sqrt(3)*a.v);
      const reduccion = (1-iDespues/iAntes)*100;
      const kvarResidual = a.kw*Math.tan(phi1) - kvarComercial;
      const kvaReal = Math.sqrt(a.kw*a.kw + kvarResidual*kvarResidual);
      const fpReal = a.kw/kvaReal;
      return {kvarNecesarios,kvarComercial,kvaAntes,kvaDespues,iAntes,iDespues,reduccion,fpReal,a};
    },
    renderResult(r){
      const rows=[
        ['FP real alcanzado', fmt(r.fpReal,2)],
        ['Corriente antes → después', fmt(r.iAntes,1)+' → '+fmt(r.iDespues,1)+' A'],
        ['Reducción de corriente', fmt(r.reduccion,1)+'%'],
      ];
      let note = {warn:false, txt:'kVAR real escala con (V_real/V_nominal)² — verifica tensión real vs placa del banco.'};
      if(r.a.vfd==='si') note = {warn:true, txt:'⚠ Hay VFDs: usar reactor de bloqueo (detuned 5.67% o 7%) — sin él, riesgo de resonancia con armónicos y falla del banco. kVAR real escala con (V_real/V_nominal)² — verifica tensión real vs placa.'};
      return {
        sev: r.a.vfd==='si' ? 'warn' : 'ok', badge: r.a.vfd==='si' ? 'VER ADVERTENCIA' : 'CALCULADO',
        big:{lbl:'Banco comercial recomendado', val:fmt(r.kvarComercial,1), u:'kVAR', sub:`${r.a.kw}kW · FP ${r.a.fp1}→${r.a.fp2} · ${r.a.v}V`},
        rows, note
      };
    },
    summary(r){ return `${fmt(r.kvarComercial,1)} kVAR · FP ${r.a.fp1}→${r.a.fp2} · ${r.a.v}V${r.a.vfd==='si'?' · ⚠ VFD':''}`; }
  },

      {key:'fpc', type:'number', label:'FP de la carga', unit:'', min:0.5, max:1.0, step:0.01, default:0.70},
      {key:'margen', type:'segment', label:'Margen crecim.', options:[{v:0,l:'0%'},{v:0.20,l:'20%'},{v:0.30,l:'30%'}], default:0.20},
      {key:'ah', type:'number', label:'Ah del banco', unit:'Ah', min:1, max:2000, step:1, default:100, show:a=>a.modo==='auto'},
      {key:'tmin', type:'number', label:'Autonomía deseada', unit:'min', min:1, max:480, step:1, default:10, show:a=>a.modo==='ah'},
      {key:'vdc', type:'number', label:'Tensión banco DC', unit:'V', min:6, max:400, step:1, default:24},
      {key:'bat', type:'segment', label:'Tipo batería', options:[{v:0.5,l:'Plomo-ácido'},{v:0.8,l:'Litio'}], default:0.5},
      {key:'eta', type:'number', label:'Eficiencia inversor', unit:'', min:0.7, max:0.99, step:0.01, default:0.90},
    ],
    compute(a){
      const vaCarga = a.w/a.fpc;
      const kvaRecomendado = roundStdKva((vaCarga*(1+a.margen))/1000);
      let autoninMin=null, ahNecesarios=null;
      if(a.modo==='auto'){ autoninMin = ((a.ah*a.vdc*a.bat*a.eta)/a.w)*60; }
      else { ahNecesarios = (a.w*(a.tmin/60))/(a.vdc*a.bat*a.eta); }
      const iDescarga = (a.w/a.eta)/a.vdc;
      return {vaCarga,kvaRecomendado,autoninMin,ahNecesarios,iDescarga,a};
    },
    renderResult(r){
      const principal = r.a.modo==='auto'
        ? {lbl:'Autonomía estimada', val:fmt(r.autoninMin,1), u:'min'}
        : {lbl:'Ah necesarios', val:fmt(r.ahNecesarios,1), u:'Ah'};
      return {
        sev:'ok', badge:'UPS '+r.kvaRecomendado+' kVA',
        big:{lbl:principal.lbl, val:principal.val, u:principal.u, sub:`${r.a.w}W · FP ${r.a.fpc} · ${r.a.vdc}V DC`},
        rows:[
          ['Capacidad UPS recomendada', r.kvaRecomendado+' kVA'],
          ['VA de carga (con margen)', fmt(r.vaCarga*(1+r.a.margen),0)+' VA'],
          ['Corriente de descarga', fmt(r.iDescarga,2)+' A'],
        ],
        note:'Vida de batería plomo-ácido cae a la mitad cada 8-10°C sobre 25°C. Online (doble conversión) recomendado cerca de VFDs.'
      };
    },
    summary(r){
      const principal = r.a.modo==='auto' ? `${fmt(r.autoninMin,1)} min` : `${fmt(r.ahNecesarios,1)} Ah`;
      return `${principal} · ${r.a.w}W · ${r.a.vdc}V DC · UPS ${r.kvaRecomendado}kVA`;
    }
  }

  openModule(id){
    ST.modId=id; ST.answers={};
    MODULES_A[id].fields.forEach(f=>{ if(typeof f.default!=='undefined') ST.answers[f.key]=f.default; });
    ST.screen='mod'; ST.sidebarOpen=false; render();
  },
  openRef(id){ ST.screen='ref-'+id; ST.sidebarOpen=false; render(); },

  activeFields(mod){ return mod.fields.filter(f=>!f.show || f.show(ST.answers)); },

  setAns(key,val){ ST.answers[key]=val; render(); },
  nudge(key,delta,min,max){
    let v=(parseFloat(ST.answers[key])||0)+delta;
    if(min!==undefined) v=Math.max(min,v); if(max!==undefined) v=Math.min(max,v);
    v=Math.round(v*100)/100; ST.answers[key]=v; render();
  },
  numInput(key,val){ ST.answers[key]= val===''?'':parseFloat(val); updateResultOnly(); },

  toggleVfd(code){ ST.vfdOpen[code]=!ST.vfdOpen[code]; render(); },
  setVfdFilter(v){ ST.vfdFilter=v; renderVfdListOnly(); },

  goHistorial(){ ST.screen='historial'; ST.sidebarOpen=false; render(); },

  saveToHistorial(){
    const mod = MODULES_A[ST.modId];
    if(!mod || !mod.historial) return;
    const res = mod.compute(ST.answers);
    const nota = prompt('¿Proyecto o área? (opcional)', '') || '';
    const entry = {
      id: Date.now()+'_'+Math.random().toString(36).slice(2,7),
      fecha: new Date().toISOString(),
      modulo: mod.id, moduloLabel: mod.label,
      nota, respuestas: {...ST.answers},
      resumen: mod.summary ? mod.summary(res) : ''
    };
    Historial.guardar(entry);
    alert('✔ Guardado en historial');
  },

  loadHistorialEntry(id){
    const entry = Historial.listar().find(e=>e.id===id);
    if(!entry) return;
    ST.modId = entry.modulo;
    ST.answers = {...entry.respuestas};
    ST.screen = 'mod';
    render();
  },

  deleteHistorialEntry(id){
    if(!confirm('¿Eliminar este cálculo del historial?')) return;
    Historial.eliminar(id);
    render();
  },

  exportHistorial(){
    const data = Historial.exportar();
    const blob = new Blob([data], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download='voltrefmx_historial_'+Date.now()+'.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  },

  importHistorial(file){
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(e){
      const ok = Historial.importar(e.target.result);
      alert(ok? '✔ Historial importado' : '✘ Archivo inválido — debe ser un .json exportado desde aquí mismo');
      render();
    };
    reader.readAsText(file);
  },
};

/* ---- FORMULARIO DE MÓDULO ---- */
function fieldRow(f){
  const val = ST.answers[f.key];
  if(f.type==='number'){
    const unit = typeof f.unit==='function'? f.unit(ST.answers) : f.unit;
    return `<div class="frow">
      <div class="flabel">${f.label}</div>
      <div class="fctrl">
        <div class="fstep" onclick="App.nudge('${f.key}',-${f.step},${f.min},${f.max})">−</div>
        <input class="fnum" type="number" inputmode="decimal" value="${val}" oninput="App.numInput('${f.key}', this.value)">
        <div class="funit">${unit}</div>
        <div class="fstep" onclick="App.nudge('${f.key}',${f.step},${f.min},${f.max})">+</div>
      </div>
    </div>`;
  }
  if(f.type==='segment'){
    return `<div class="frow">
      <div class="flabel">${f.label}</div>
      <div class="fseg">${f.options.map(o=>`<div class="o ${val===o.v?'active':''}" onclick="App.setAns('${f.key}', ${typeof o.v==='number'?o.v:`'${escJs(o.v)}'`})">${o.l}</div>`).join('')}</div>
    </div>`;
  }
  if(f.type==='choice'){
    return `<div class="frow">
      <div class="flabel">${f.label}</div>
      <div class="fchoice-row">${f.options.map(o=>`<div class="fchoice ${val===o.v?'active':''}" onclick="App.setAns('${f.key}', '${escJs(o.v)}')">${o.l}</div>`).join('')}</div>
    </div>`;
  }
  if(f.type==='select'){
    const opts = typeof f.opts==='function' ? f.opts(ST.answers) : f.opts;
    return `<div class="frow">
      <div class="flabel">${f.label}</div>
      <select class="fselect" onchange="App.setAns('${f.key}', this.value)">
        ${opts.map(o=>`<option value="${escJs(o.v)}" ${String(val)===String(o.v)?'selected':''}>${o.l}</option>`).join('')}
      </select>
    </div>`;
  }
  return '';
}

function renderAcad(){ return renderRefGeneric(ACAD_DATA, '📏 Comandos generales, AutoCAD Electrical (esquemático), capas y biblioteca de símbolos IEC/NEMA. ⚠ Conocimiento general de la herramienta, no un KB tuyo verificado — confirma nombres de capa contra tu plantilla real.'); }

/* ---- REFERENCIA: HERRAMIENTAS ---- */
function renderHerramientas(){
  const cards = HERRAMIENTAS.map(g=>`
    <div class="refcard" ${g.danger?'style="border-left:2px solid var(--led-danger)"':''}>
      <h3>${g.ic} ${g.title}</h3><div class="inner">${rtable(g.headers,g.rows,g.hideHead)}${g.note?`<div class="rnote" style="margin-top:8px">${g.note}</div>`:''}</div>
    </div>`).join('');
  return `<div class="stage">${cards}</div>`;
}

/* ---- HISTORIAL (piloto: solo módulos con historial:true — capacitores y UPS) ---- */
function renderHistorial(){
  const arr = Historial.listar();
  const items = arr.map(e=>{
    const mod = MODULES_A[e.modulo];
    const color = mod ? mod.tc : '#888';
    const fecha = new Date(e.fecha).toLocaleString('es-MX',{dateStyle:'short',timeStyle:'short'});
    return `
    <div class="refcard" style="border-left:2px solid ${color}">
      <div class="inner">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
          <div style="flex:1">
            <div style="font-size:11px;color:var(--text2)">${fecha} · ${e.moduloLabel}</div>
            ${e.nota?`<div style="font-weight:700;margin:2px 0">${escHtml(e.nota)}</div>`:''}
            <div style="font-size:12.5px;margin-top:4px">${escHtml(e.resumen)}</div>
          </div>
          <div onclick="App.deleteHistorialEntry('${e.id}')" style="padding:4px 8px;color:var(--led-danger);font-size:16px;cursor:pointer">🗑</div>
        </div>
        <div class="actbtn" style="margin:10px 0 0 0" onclick="App.loadHistorialEntry('${e.id}')">Ver / recargar →</div>
      </div>
    </div>`;
  }).join('');
  return `<div class="stage">
    ${arr.length===0?`<div class="refcard"><div class="inner" style="text-align:center;color:var(--text2);padding:20px 10px">Aún no guardas ningún cálculo.<br><br>Ve a Banco de Capacitores o UPS, calcula, y toca "💾 Guardar en historial".</div></div>`:items}
    ${arr.length>0?`<div class="refcard"><div class="inner"><div class="actbtn" onclick="App.exportHistorial()">⬇ Exportar historial (.json)</div></div></div>`:''}
    <div class="refcard"><div class="inner">
      <label class="actbtn" style="display:block">⬆ Importar historial
        <input type="file" accept=".json,application/json" style="display:none" onchange="App.importHistorial(this.files[0])">
      </label>
      <div style="font-size:10.5px;color:var(--text2);margin-top:8px;line-height:1.5">El historial vive en este navegador — comparte con unamano.html si están en el mismo sitio, pero no sincroniza con otro dispositivo. Usa exportar/importar para respaldar o mover.</div>
    </div></div>
  </div>`;
}

render();
setInterval(()=>{ const c=document.getElementById('clockslot'); if(c) c.textContent=clockStr(); }, 15000);

</script>
