<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>VoltRefMX · Tablero</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#040a06">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VoltRefMX">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">

<style>
/* ===== TEMA CLARO (por defecto) — "papel de ingeniería" con acento fósforo ===== */
:root{
  --bg:#f3f6f1; --panel:#ffffff; --panel2:#eef2ea; --panel3:#e2e9dc;
  --line:#d3ddc9; --line2:#c1cdb5;
  --text:#16241a; --text2:#4d5c47; --dim:#8b9884;
  --accent:#0e8a3f; --accent-dim:rgba(14,138,63,.10); --accent-bdr:rgba(14,138,63,.35);
  --led-ok:#0e8a3f; --led-ok-bg:rgba(14,138,63,.10);
  --led-warn:#a66c00; --led-warn-bg:rgba(166,108,0,.10);
  --led-danger:#c0362c; --led-danger-bg:rgba(192,54,44,.10);
  --grid-line:rgba(14,138,63,.07);
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  --mono:'SF Mono','JetBrains Mono',ui-monospace,'Cascadia Code',Consolas,monospace;
  --sans:-apple-system,'Segoe UI',system-ui,sans-serif;
}
/* ===== TEMA OSCURO — fósforo verde sobre negro, tipo radar/osciloscopio ===== */
body.theme-dark{
  --bg:#040a06; --panel:#08120b; --panel2:#0d1a11; --panel3:#132818;
  --line:rgba(57,255,140,.16); --line2:rgba(57,255,140,.28);
  --text:#daffe9; --text2:#7fcf9c; --dim:#3d6b4d;
  --accent:#39ff88; --accent-dim:rgba(57,255,136,.12); --accent-bdr:rgba(57,255,136,.35);
  --led-ok:#39ff88; --led-ok-bg:rgba(57,255,136,.12);
  --led-warn:#ffcc33; --led-warn-bg:rgba(255,204,51,.12);
  --led-danger:#ff5c5c; --led-danger-bg:rgba(255,92,92,.12);
  --grid-line:rgba(57,255,136,.05);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text); font-family:var(--mono);
  overflow:hidden; position:fixed; inset:0; font-size:13px; transition:background .2s, color .2s;
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size:22px 22px;
}
input,select,button{font-family:inherit;}
#app{position:absolute; inset:0; display:flex; flex-direction:column;}

@keyframes ledpulse{0%,100%{opacity:1} 50%{opacity:.4}}
.led{width:7px; height:7px; border-radius:50%; flex-shrink:0; box-shadow:0 0 6px currentColor;}
.led.ok{background:var(--led-ok); color:var(--led-ok);}
.led.warn{background:var(--led-warn); color:var(--led-warn);}
.led.danger{background:var(--led-danger); color:var(--led-danger);}
.led.idle{background:var(--dim); color:var(--dim); box-shadow:none;}
.led.live{animation:ledpulse 1.6s ease-in-out infinite;}

/* ===== TOP STATUS BAR ===== */
.statusbar{
  flex-shrink:0; padding: calc(8px + var(--safe-t)) 12px 8px;
  display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--line);
  background:linear-gradient(180deg, var(--panel2), var(--panel));
}
.sb-menu{width:34px; height:34px; border-radius:6px; border:1px solid var(--line2); background:var(--panel3);
  display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; color:var(--accent);}
.sb-menu:active{background:var(--panel2);}
.sb-brand{font-weight:800; font-size:13px; letter-spacing:.06em; color:var(--text);}
.sb-brand b{color:var(--accent);}
.sb-sub{font-size:9.5px; color:var(--dim); letter-spacing:.1em; margin-top:1px;}
.sb-status{margin-left:auto; display:flex; align-items:center; gap:6px; font-size:10px; color:var(--led-ok); letter-spacing:.08em;}
.sb-clock{font-size:10px; color:var(--dim); margin-left:8px;}
.sb-theme{width:30px; height:30px; border-radius:6px; border:1px solid var(--line2); background:var(--panel3);
  display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; margin-left:6px; color:var(--text2);}
.sb-theme:active{background:var(--panel2);}

/* ===== SIDEBAR (drawer) ===== */
.overlay{position:absolute; inset:0; background:rgba(0,0,0,.55); z-index:20; opacity:0; pointer-events:none; transition:opacity .2s;}
.overlay.open{opacity:1; pointer-events:auto;}
.sidebar{
  position:absolute; top:0; bottom:0; left:0; width:250px; z-index:21;
  background:var(--panel2); border-right:1px solid var(--line);
  transform:translateX(-100%); transition:transform .22s ease; display:flex; flex-direction:column;
  padding-top:var(--safe-t); padding-bottom:var(--safe-b);
}
.sidebar.open{transform:translateX(0);}
.sb-head{padding:16px 16px 12px; border-bottom:1px solid var(--line);}
.sb-head .l1{font-size:9.5px; letter-spacing:.16em; color:var(--dim); font-weight:800;}
.sb-head .l2{font-size:15px; font-weight:800; margin-top:3px;}
.sb-group{padding:12px 10px 4px; font-size:9.5px; letter-spacing:.14em; color:var(--dim); font-weight:800;}
.sb-item{
  display:flex; align-items:center; gap:10px; padding:11px 12px; margin:1px 6px; border-radius:7px;
  color:var(--text2); font-size:12.5px;
}
.sb-item .ic{width:18px; text-align:center; font-size:13px;}
.sb-item.active{background:var(--accent-dim); color:var(--accent); border:1px solid var(--accent-bdr);}
.sb-item.active .led{background:var(--accent); box-shadow:0 0 6px var(--accent);}
.sb-item:not(.active){border:1px solid transparent;}
.sb-item:active{background:var(--panel3);}
.sb-item .lbl{flex:1;}

/* ===== MAIN STAGE ===== */
.stage{flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:calc(14px + var(--safe-b));}
.stage::-webkit-scrollbar{display:none;}

/* ===== DASHBOARD HOME ===== */
.dash-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:10px 10px 4px;}
.dash-tile{
  background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:12px 10px;
  display:flex; flex-direction:column; gap:8px; min-height:88px;
}
.dash-tile:active{background:var(--panel3); border-color:var(--line2);}
.dash-tile .row1{display:flex; align-items:center; justify-content:space-between;}
.dash-tile .ic{font-size:18px;}
.dash-tile .name{font-size:11.5px; font-weight:700; color:var(--text); line-height:1.25;}
.dash-tile .sub{font-size:9.5px; color:var(--dim); font-family:var(--mono); letter-spacing:.03em;}
.panel-hd{padding:12px 14px 4px; display:flex; align-items:center; gap:8px;}
.panel-hd .t{font-size:10px; letter-spacing:.14em; color:var(--dim); font-weight:800;}
.panel-hd .line{flex:1; height:1px; background:var(--line);}

/* ===== FORM PANEL (módulo activo) ===== */
.modhead{
  padding:12px 14px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--line);
  background:var(--panel2); position:sticky; top:0; z-index:2;
}
.modhead .ic{width:32px; height:32px; border-radius:7px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;}
.modhead .t1{font-size:14px; font-weight:800;}
.modhead .t2{font-size:9.5px; color:var(--dim); letter-spacing:.04em;}

.fpanel{margin:10px 12px; background:var(--panel2); border:1px solid var(--line); border-radius:9px; overflow:hidden;}
.fpanel .fhd{padding:9px 12px; font-size:10px; letter-spacing:.12em; color:var(--dim); font-weight:800; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:7px;}
.frow{display:flex; align-items:center; gap:10px; padding:11px 12px; border-top:1px solid var(--line);}
.frow:first-of-type{border-top:none;}
.frow .flabel{flex:0 0 108px; font-size:11.5px; color:var(--text2);}
.frow .fctrl{flex:1; display:flex; align-items:center; gap:6px; min-width:0;}
.fnum{
  flex:1; background:var(--panel); border:1px solid var(--line2); border-radius:6px; padding:8px 10px;
  color:var(--accent); font-family:var(--mono); font-size:14px; font-weight:700; text-align:right; min-width:0;
}
.fnum:focus{outline:none; border-color:var(--accent);}
.funit{font-size:10px; color:var(--dim); width:34px; flex-shrink:0;}
.fstep{width:28px; height:28px; border-radius:6px; background:var(--panel3); border:1px solid var(--line2); color:var(--text2); font-size:15px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.fstep:active{background:var(--panel);}
.fseg{display:flex; flex:1; background:var(--panel); border-radius:6px; border:1px solid var(--line2); overflow:hidden;}
.fseg .o{flex:1; text-align:center; padding:8px 4px; font-size:11px; color:var(--text2); font-weight:700;}
.fseg .o.active{background:var(--accent-dim); color:var(--accent);}
.fselect{flex:1; background:var(--panel); border:1px solid var(--line2); border-radius:6px; padding:8px 10px; color:var(--text); font-size:12.5px; appearance:none; font-family:var(--mono);}
.fchoice-row{display:flex; flex-wrap:wrap; gap:6px; flex:1;}
.fchoice{padding:7px 11px; border-radius:6px; background:var(--panel); border:1px solid var(--line2); font-size:11px; color:var(--text2); font-weight:700;}
.fchoice.active{background:var(--accent-dim); color:var(--accent); border-color:var(--accent-bdr);}

/* ===== RESULT PANEL (live) ===== */
.rpanel{margin:10px 12px 16px; background:var(--panel2); border:1px solid var(--accent-bdr); border-radius:9px; overflow:hidden; box-shadow:0 0 0 1px rgba(0,0,0,.02), 0 8px 24px rgba(0,0,0,.35);}
.rpanel .rhd{padding:9px 12px; display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--line); background:rgba(0,0,0,.02);}
.rpanel .rhd .t{font-size:10px; letter-spacing:.14em; color:var(--accent); font-weight:800; flex:1;}
.rpanel .rhd .badge{font-size:9.5px; padding:3px 8px; border-radius:5px; font-weight:800; letter-spacing:.03em;}
.rpanel .rhd .badge.ok{background:var(--led-ok-bg); color:var(--led-ok);}
.rpanel .rhd .badge.warn{background:var(--led-warn-bg); color:var(--led-warn);}
.rpanel .rhd .badge.danger{background:var(--led-danger-bg); color:var(--led-danger);}
.rbig{padding:16px 14px 10px; text-align:center;}
.rbig .lbl{font-size:9.5px; letter-spacing:.12em; color:var(--dim); font-weight:800;}
.rbig .val{font-size:38px; font-weight:800; margin-top:4px; color:var(--text); font-variant-numeric:tabular-nums;}
.rbig .val .u{font-size:16px; color:var(--dim); margin-left:3px;}
.rbig .sub{font-size:11px; color:var(--text2); margin-top:4px;}
.rrows{padding:2px 12px 12px;}
.rrow{display:flex; justify-content:space-between; align-items:center; padding:8px 2px; border-top:1px solid var(--line); font-size:11.5px;}
.rrow:first-child{border-top:none;}
.rrow .k{color:var(--dim);}
.rrow .v{font-weight:700; color:var(--text);}
.rrow.hi .v{color:var(--accent);}
.rnote{margin:0 12px 4px 12px; padding:10px 11px; font-size:10.5px; color:var(--text2); line-height:1.55; background:var(--panel); border-left:2px solid var(--line2); border-radius:0 6px 6px 0;}
.rnote.warn{border-left-color:var(--led-warn); background:var(--led-warn-bg);}

/* ===== FÓRMULA VISIBLE ===== */
.fmlbox{margin:8px 12px 4px; border:1px solid var(--line); border-radius:7px; overflow:hidden; background:var(--panel);}
.fml-toggle{display:flex; align-items:center; justify-content:space-between; padding:9px 11px; font-size:10.5px; font-weight:800; letter-spacing:.03em; color:var(--accent); cursor:pointer;}
.fml-toggle:active{background:var(--panel3);}
.fml-body{padding:0 11px 11px; border-top:1px solid var(--line);}
.fml-row{padding:8px 0 2px;}
.fml-k{font-size:9px; letter-spacing:.1em; color:var(--dim); font-weight:800; text-transform:uppercase;}
.fml-v{font-size:11.5px; color:var(--text); margin-top:3px; line-height:1.5; word-break:break-word;}
.fml-norma{margin-top:8px; font-size:10px; color:var(--text2); font-style:italic;}
.fml-pend{margin-top:8px; padding:8px 9px; font-size:10px; line-height:1.5; color:var(--text2); background:var(--led-warn-bg); border-left:2px solid var(--led-warn); border-radius:0 5px 5px 0;}
.actbtn{margin:0 12px 12px 12px; padding:12px; text-align:center; font-weight:700; font-size:13px; color:var(--accent); background:var(--accent-dim); border:1px solid var(--accent-bdr); border-radius:8px;}
.actbtn:active{opacity:.75;}

/* ===== REF TABLES ===== */
.refcard{margin:10px 12px; background:var(--panel2); border:1px solid var(--line); border-radius:9px; overflow:hidden;}
.refcard h3{margin:0; padding:10px 12px; font-size:12px; font-weight:800; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px;}
.refcard .inner{padding:10px 12px;}
.rtable-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -12px; padding:0 12px;}
.rtable{width:100%; min-width:max-content; border-collapse:collapse; font-size:11.5px;}
.rtable th{text-align:left; font-size:9.5px; letter-spacing:.06em; color:var(--dim); font-weight:800; padding:0 12px 7px 0; white-space:nowrap;}
.rtable td{padding:8px 12px 8px 0; border-top:1px solid var(--line); color:var(--text2); white-space:nowrap;}
.rtable td:first-child{color:var(--text); font-weight:700;}
.swatchrow{display:flex; align-items:center; gap:9px; padding:7px 0; border-top:1px solid var(--line);}
.swatchrow:first-child{border-top:none;}
.swatch{width:20px; height:20px; border-radius:4px; border:1px solid rgba(255,255,255,.12); flex-shrink:0;}
.swatchrow .l{flex:1; font-size:11.5px; font-weight:700;}
.swatchrow .r{font-size:10px; color:var(--dim);}
.vfd-item{border-top:1px solid var(--line);}
.vfd-item:first-child{border-top:none;}
.vfd-head{display:flex; align-items:center; gap:10px; padding:11px 12px;}
.vfd-head .code{font-size:13px; font-weight:800; width:44px; flex-shrink:0;}
.vfd-head .name{flex:1; font-size:11.5px; color:var(--text2);}
.vfd-body{padding:0 12px 12px; font-size:11px; color:var(--text2); line-height:1.6; display:none;}
.vfd-item.open .vfd-body{display:block;}
.vfd-body b{color:var(--text);}
.vfd-body .sec{margin-top:8px; font-size:9.5px; letter-spacing:.08em; color:var(--dim); font-weight:800;}
.searchbar{display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--line2); border-radius:7px; padding:8px 11px; margin:10px 12px;}
.searchbar input{flex:1; background:transparent; border:none; color:var(--text); font-size:12.5px; outline:none;}
.loto-step{display:flex; gap:10px; padding:10px 0; border-top:1px solid var(--line);}
.loto-step:first-child{border-top:none;}
.loto-num{width:22px; height:22px; border-radius:50%; background:var(--accent-dim); border:1px solid var(--accent-bdr); color:var(--accent); font-weight:800; font-size:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.loto-verb{font-size:11.5px; font-weight:800;}
.loto-desc{font-size:10.5px; color:var(--dim); margin-top:2px; line-height:1.5;}
.subhead{font-size:10.5px; font-weight:800; margin:12px 0 6px; color:var(--text2);}

.hidden{display:none !important;}

/* ===== CONVERSOR — botón flotante + pantalla nativa (mismo patrón que un módulo) ===== */
.conv-fab{
  position:fixed; right:14px; bottom:calc(14px + var(--safe-b)); z-index:15;
  width:50px; height:50px; border-radius:50%; background:var(--accent-dim);
  border:1px solid var(--accent-bdr); display:flex; align-items:center; justify-content:center;
  font-size:20px; color:var(--accent); box-shadow:0 4px 14px rgba(0,0,0,.25);
}
.conv-fab.active{background:var(--accent); color:var(--panel); box-shadow:0 0 0 4px var(--accent-dim), 0 4px 14px rgba(0,0,0,.3);}
.conv-fab:active{opacity:.8;}
.tabscroll-wrap{position:relative; margin:10px 12px 0;}
.tabscroll{display:flex; gap:6px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:2px;}
.tabscroll::-webkit-scrollbar{display:none;}
.tabscroll .fchoice{flex-shrink:0; white-space:nowrap;}
.tabarrow{
  position:absolute; top:0; bottom:2px; width:26px; display:flex; align-items:center;
  font-size:15px; font-weight:800; color:var(--accent); pointer-events:none;
  opacity:0; transition:opacity .15s;
}
.tabarrow-l{left:-2px; justify-content:flex-start; background:linear-gradient(to right, var(--bg) 45%, transparent);}
.tabarrow-r{right:-2px; justify-content:flex-end; background:linear-gradient(to left, var(--bg) 45%, transparent);}
.tabscroll-wrap.show-l .tabarrow-l{opacity:1;}
.tabscroll-wrap.show-r .tabarrow-r{opacity:1;}
.conv-out{margin:8px 12px 0; padding:10px 11px; background:var(--panel); border-radius:7px; border:1px solid var(--line);}
.conv-out .row{display:flex; justify-content:space-between; padding:5px 2px; font-size:12.5px;}
.conv-out .row .k{color:var(--dim);}
.conv-out .row .v{font-weight:700; color:var(--accent); font-variant-numeric:tabular-nums;}

/* ===== ADAPTACIÓN A PANTALLA ANCHA (laptop/escritorio) =====
   En celular, statusbar/modhead/stage ocupan todo el ancho por diseño.
   En pantallas anchas eso los estira demasiado y el texto se ve chico
   en proporción. Aquí se limita el ancho y se centra, sin tocar fuentes
   ni lógica — el sidebar sigue abriendo sobre toda la pantalla igual. */
@media (min-width:701px){
  #app{ align-items:center; }
  #app > .statusbar,
  #app > .modhead,
  #app > .stage{
    width:100%;
    max-width:640px;
  }
}

/* ===== MEMORIA DE CÁLCULO (exportar a PDF) =====
   Formulario de encabezado (texto libre) + vista previa + hoja de impresión.
   La hoja siempre es "papel" blanco, sin importar el tema claro/oscuro. */
input.memo-in, textarea.memo-in{user-select:text; -webkit-user-select:text;}
#memo-root{position:relative; z-index:60;}
.memo-modal{position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:flex-end; justify-content:center; z-index:60;}
.memo-card{width:100%; max-width:560px; max-height:92vh; display:flex; flex-direction:column; background:var(--panel2);
  border:1px solid var(--line2); border-radius:14px 14px 0 0; padding-bottom:var(--safe-b);}
@media (min-width:701px){ .memo-modal{align-items:center;} .memo-card{border-radius:14px;} }
.memo-hd{display:flex; align-items:center; gap:8px; padding:14px 14px 4px;}
.memo-hd .t{flex:1; font-size:14px; font-weight:800; color:var(--accent);}
.memo-hd .x{width:30px; height:30px; border-radius:6px; border:1px solid var(--line2); background:var(--panel3); display:flex; align-items:center; justify-content:center; color:var(--text2);}
.memo-sub{padding:0 14px 6px; font-size:10.5px; color:var(--text2); line-height:1.5;}
.memo-body{overflow-y:auto; -webkit-overflow-scrolling:touch; padding:2px 14px 8px;}
.memo-lbl{font-size:10px; letter-spacing:.08em; color:var(--dim); font-weight:800; margin:10px 0 4px;}
.memo-in{width:100%; background:var(--panel); border:1px solid var(--line2); border-radius:6px; padding:10px; color:var(--text);
  font-family:var(--sans); font-size:14px;}
.memo-in:focus{outline:none; border-color:var(--accent);}
textarea.memo-in{min-height:68px; resize:vertical;}
.memo-row2{display:flex; gap:8px;} .memo-row2 > div{flex:1; min-width:0;}
.memo-actions{display:flex; gap:8px; padding:10px 14px 12px;}
.memo-btn{flex:1; text-align:center; padding:12px 8px; border-radius:8px; font-weight:700; font-size:13px;
  border:1px solid var(--accent-bdr); color:var(--accent); background:var(--accent-dim);}
.memo-btn.primary{background:var(--accent); color:var(--panel); border-color:var(--accent);}
.memo-btn:active{opacity:.75;}
.memo-preview{position:fixed; inset:0; z-index:60; background:#d9ded6; overflow-y:auto; -webkit-overflow-scrolling:touch;}
.memo-toolbar{position:sticky; top:0; z-index:2; display:flex; gap:8px; padding:calc(8px + var(--safe-t)) 10px 8px; background:#0b1a10;}
.memo-toolbar .memo-btn{flex:none; padding:9px 12px; font-size:12px; background:transparent; color:#39ff88; border-color:rgba(57,255,136,.4);}
.memo-toolbar .memo-btn.primary{flex:1; background:#39ff88; color:#04120a; border-color:#39ff88;}
.memo-hint{max-width:820px; margin:10px auto 0; padding:0 16px; font-size:10.5px; color:#4d5c47; line-height:1.5; font-family:var(--sans);}
.memo-toast{position:fixed; left:50%; bottom:calc(80px + var(--safe-b)); transform:translateX(-50%); z-index:70; background:#222; color:#fff;
  padding:10px 14px; border-radius:8px; font-size:12px; max-width:88vw; text-align:center;}

/* --- Hoja (papel) --- */
.memo-paper, .memo-paper *{user-select:text; -webkit-user-select:text;}
.memo-paper{max-width:820px; margin:10px auto 26px; background:#fff; color:#14201a; padding:20px 18px 24px;
  box-shadow:0 2px 14px rgba(0,0,0,.25); font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif; font-size:12px; line-height:1.45;
  -webkit-print-color-adjust:exact; print-color-adjust:exact;}
.mp-top{display:flex; justify-content:space-between; align-items:flex-end; gap:10px; border-bottom:3px solid #0e8a3f; padding-bottom:8px;}
.mp-title{font-size:20px; font-weight:800; letter-spacing:.03em;}
.mp-sub{font-size:12px; color:#4d5c47; margin-top:2px;}
.mp-brand{font-size:10px; text-align:right; color:#4d5c47; line-height:1.35; flex-shrink:0;}
.mp-brand b{color:#0e8a3f; font-size:12px; letter-spacing:.06em;}
.mp-meta{display:grid; grid-template-columns:2fr 1fr; gap:0 14px; margin-top:10px;}
.mp-meta .full{grid-column:1 / -1;}
.mp-cell{margin-top:6px;}
.mp-cl{font-size:8.5px; letter-spacing:.1em; font-weight:800; color:#6b7a63; text-transform:uppercase;}
.mp-cv{min-height:1.6em; border-bottom:1px solid #9aa693; padding:1px 2px; font-size:12.5px; font-weight:600; overflow-wrap:anywhere;}
.mp-sec{margin-top:14px; page-break-inside:avoid; break-inside:avoid;}
.mp-h{font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:#0e6b30; border-left:4px solid #0e8a3f; padding:1px 0 1px 8px; margin-bottom:6px;}
.mp-t{width:100%; border-collapse:collapse; font-size:11.5px;}
.mp-t td{padding:4px 6px; border-bottom:1px solid #d3ddc9; vertical-align:top;}
.mp-t td.r{text-align:right; font-weight:700; white-space:nowrap;}
.mp-t td.u{width:52px; color:#6b7a63; font-size:10.5px;}
.mp-step{margin-bottom:8px; page-break-inside:avoid; break-inside:avoid;}
.mp-st{font-size:11.5px; font-weight:700; margin-bottom:2px;}
.mp-fl{font-family:ui-monospace,'SF Mono',Consolas,'DejaVu Sans Mono',monospace; font-size:10.8px; background:#f3f6f1; border-left:2px solid #c1cdb5;
  padding:3px 8px; margin-top:2px; white-space:pre-wrap; overflow-wrap:anywhere;}
.mp-result{display:flex; align-items:center; justify-content:space-between; gap:10px; border:1.5px solid #0e8a3f; border-radius:6px; padding:10px 12px; margin-bottom:6px;
  page-break-inside:avoid; break-inside:avoid;}
.mp-result.warn{border-color:#a66c00;} .mp-result.danger{border-color:#c0362c;}
.mp-rl{font-size:9px; letter-spacing:.1em; font-weight:800; color:#6b7a63; text-transform:uppercase;}
.mp-rv{font-size:26px; font-weight:800; line-height:1.15;}
.mp-rv span{font-size:13px; color:#6b7a63; margin-left:3px;}
.mp-rs{font-size:10.5px; color:#4d5c47;}
.mp-badge{font-size:10.5px; font-weight:800; letter-spacing:.04em; padding:5px 10px; border-radius:5px; border:1px solid #0e8a3f; background:#e3f3e8; color:#0e6b30; text-align:center; flex-shrink:0;}
.mp-badge.warn{background:#fff3d6; color:#8a5a00; border-color:#a66c00;}
.mp-badge.danger{background:#fde4e1; color:#a4271e; border-color:#c0362c;}
.mp-note{font-size:10.5px; color:#4d5c47; margin-top:5px;}
.mp-list{margin:0; padding-left:16px; font-size:11px;} .mp-list li{margin-bottom:3px;}
.mp-warn{border:1.5px solid #a66c00; background:#fff8e6; border-radius:6px; padding:8px 10px; font-size:11px;}
.mp-warn b{color:#8a5a00;} .mp-warn p{margin:4px 0 0;}
.mp-usernote{border:1px solid #c1cdb5; border-radius:6px; padding:8px 10px; font-size:11.5px; white-space:pre-wrap; overflow-wrap:anywhere;}
.mp-sign{display:grid; grid-template-columns:1fr 1fr; gap:26px; margin-top:26px; page-break-inside:avoid; break-inside:avoid;}
.mp-sline{border-top:1px solid #14201a; padding-top:3px; font-size:10px; color:#4d5c47; min-height:2.4em;}
.mp-sline b{display:block; font-size:11.5px; color:#14201a;}
.mp-foot{margin-top:16px; padding-top:6px; border-top:1px solid #d3ddc9; font-size:9px; color:#6b7a63; line-height:1.45;}

@page{size:letter; margin:13mm 12mm;}
@media print{
  html,body{height:auto !important; overflow:visible !important; position:static !important; background:#fff !important;}
  body{background-image:none !important;}
  #app,.conv-fab,.memo-toast,.memo-modal,.memo-toolbar,.memo-hint{display:none !important;}
  #memo-root{position:static !important; display:block !important;}
  .memo-preview{position:static !important; inset:auto !important; overflow:visible !important; background:#fff !important;}
  .memo-paper{box-shadow:none !important; margin:0 !important; max-width:none !important; padding:0 !important; font-size:10.5pt;}
}

/* ===== MÓDULO ITM MULTIMOTOR ===== */
.itmrow{margin:8px 12px; padding:10px; background:var(--panel2); border:1px solid var(--line); border-radius:9px;}
.itmhd{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-size:12px; color:var(--accent);}
.itmdel{padding:4px 10px; border:1px solid var(--line2); border-radius:6px; font-size:10.5px; font-weight:800; color:var(--led-danger);}
.itmgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
.itmgrid label{display:flex; flex-direction:column; gap:3px; font-size:9.5px; color:var(--dim); letter-spacing:.03em; font-weight:700; min-width:0;}
.itmgrid label.full{grid-column:1 / -1;}
.itmgrid label.chk{flex-direction:row; align-items:center; justify-content:space-between; gap:8px; padding:6px 8px; border:1px solid var(--line2); border-radius:6px; background:var(--panel); font-size:11px; color:var(--text2); align-self:end;}
.itmgrid label.chk input{width:20px; height:20px;}
.itmgrid .fselect, .itmgrid .fnum{width:100%; box-sizing:border-box; flex:none;}

.itmbar div{text-align:center; min-width:0;}
.itmbar .k{font-size:8px; color:var(--dim); letter-spacing:.06em; font-weight:800;}
.itmbar .v{font-size:13px; font-weight:800; color:var(--accent); font-variant-numeric:tabular-nums; white-space:nowrap;}
.itmflc{margin-top:8px; font-size:11px; color:var(--text2); line-height:1.5;}
.itmln{font-size:11.5px; color:var(--text2); line-height:1.6; padding:2px 0; word-break:break-word;}
.itmln b{color:var(--text);}
.itmdim{color:var(--dim); font-size:10px;}
.itmpend{color:var(--led-warn); font-weight:800;}

// FLC de tabla para el módulo Motor (Art. 430-6(a)): tri → 430-250, mono → 430-248.
// Solo usa columnas verificadas; si la tensión o los HP no caen en la tabla cargada devuelve ok:false (el módulo avisa y estima).
function hpNum(h){ if(typeof h==='number') return h; return String(h).trim().split(/\s+/).reduce((t,x)=>t+(x.includes('/')?(+x.split('/')[0])/(+x.split('/')[1]):+x),0); }
function motorFlcTabla(sistema, v, hpCalc){
  const tri = sistema==='tri';
  const data = tri ? MOTOR_FLC_DATA : MOTOR_FLC_MONO_DATA;
  const tabla = tri ? '430-250' : '430-248';
  let col=null, colTxt='';
  if(tri){
    if(v>=440 && v<=480){ col='v460'; colTxt='460 V (sistemas de 440–480 V)'; }
    else if(v>=220 && v<=240){ col='v230'; colTxt='230 V (sistemas de 220–240 V)'; }
    else if(v===208){ col='v208'; colTxt='208 V'; }
    else if(v>=550 && v<=600){ col='v575'; colTxt='575 V (sistemas de 550–600 V)'; }
  } else {
    if(v>=110 && v<=120){ col='v115'; colTxt='115 V (110–120 V)'; }
    else if(v>=121 && v<=130){ col='v127'; colTxt='127 V'; }
    else if(v===208){ col='v208'; colTxt='208 V'; }
    else if(v>=220 && v<=240){ col='v230'; colTxt='230 V (220–240 V)'; }
  }
  if(!col) return {ok:false, tabla, motivo:`la tensión ${v} V no coincide con una columna verificada de la Tabla ${tabla}`};
  const row = data.find(m=>hpNum(m.hp) >= hpCalc/1.04);   // 4 % de tolerancia para el par kW↔HP comercial: 0.75 kW ≈ 1 HP, 2.2 kW ≈ 3 HP, 90 kW ≈ 125 HP
  if(!row) return {ok:false, tabla, motivo:`la potencia (${fmt(hpCalc,1)} HP) rebasa las filas cargadas de la Tabla ${tabla} (máx. ${data[data.length-1].hp} HP)`};
  if(row[col]==null){
    const why = row.pend && row.pend[col] ? row.pend[col] : 'la Tabla '+tabla+' no trae valor en esa casilla (vacía en el PDF)';
    return {ok:false, tabla, motivo:`${row.hp} HP a ${colTxt}: ${why}`};
  }
  return {ok:true, tabla, col, colTxt, hp:row.hp, I:row[col], exacto: Math.abs(hpNum(row.hp)-hpCalc)/hpCalc <= 0.04};
}

<script>
/* ===================================================================
   VoltRefMX · Tablero de control — MOTOR DE LA APP
   =================================================================== */
const $app = document.getElementById('app');
const ST = {
  sidebarOpen:false, screen:'home', modId:null, answers:{}, vfdOpen:{}, vfdFilter:'', theme:'light', formulaOpen:{},
  convReturn: null,
  conv: {
    tab:'motores',
    vals:{
      power:   {v:10, u:'hp'},
      torque:  {v:10, u:'nm'},
      rpmhz:   {v:60, mode:'hz', poles:4},
      cable:   {awg:'12 AWG', mm2rev:'', condSize:'3/4"'},
      pressure:{v:1, u:'bar'},
      temp:    {v:25, u:'c'},
      length:  {v:1, u:'m'},
      lux:     {v:500, u:'lux'},
      loop:    {min:0, max:100, mode:'ma', ma:12, eng:''},
    }
  }
};

function fmt(n,d){ if(n===null||n===undefined||isNaN(n)) return '—'; d=d===undefined?2:d; return Number(n).toLocaleString('es-MX',{minimumFractionDigits:0,maximumFractionDigits:d}); }
// Escapa comillas en valores embebidos en atributos onclick/value (ej. tamaños de conduit tipo 1/2")
function escJs(v){ return String(v).replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
// Escapa texto libre (ej. nota del historial) antes de insertarlo como contenido HTML
function escHtml(v){ return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Historial de cálculos — localStorage. Comparte origen con unamano.html si están en el mismo sitio.
const Historial = {
  KEY: 'voltrefmx_historial',
  listar(){ try{ return JSON.parse(localStorage.getItem(this.KEY)||'[]'); }catch(e){ return []; } },
  guardar(entry){ const arr=this.listar(); arr.unshift(entry); localStorage.setItem(this.KEY, JSON.stringify(arr)); },
  eliminar(id){ const arr=this.listar().filter(e=>e.id!==id); localStorage.setItem(this.KEY, JSON.stringify(arr)); },
  exportar(){ return JSON.stringify(this.listar(), null, 2); },
  importar(json){ try{ const arr=JSON.parse(json); if(Array.isArray(arr)){ localStorage.setItem(this.KEY, JSON.stringify(arr)); return true; } }catch(e){} return false; }
};
function esc(s){ return (s+'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------------------------------------------------------------
   MÓDULOS DE CÁLCULO — mismos datos/fórmulas que el KB del proyecto
--------------------------------------------------------------- */
const MODULES_A = {

  caida: {
    id:'caida', label:'Caída de tensión', ic:'⚡', tc:'#22d3ee', tcbg:'rgba(34,211,238,.12)',
    desc:'ΔV — NOM-001 Tabla 9',
    info:'Método de impedancia (NOM-001-SEDE-2012 Tabla 9): ΔV% = (k·I·L_km·Z)/Vn×100, con k=√3 (trifásico) o 2 (monofásico), y Z=√(R²+XL²) tomado de la Tabla 9 para conduit de acero, cobre, 75°C, 60Hz. El resultado se compara contra el límite que elijas (3% o 5%).',
    fields:[
      {key:'sistema', type:'segment', label:'Sistema', options:[{v:'tri',l:'Trifásico'},{v:'mono',l:'Monofásico'}], default:'tri'},
      {key:'vn', type:'number', label:'Tensión Vn', unit:'V', min:12, max:13800, step:1, default:220},
      {key:'i', type:'number', label:'Corriente I', unit:'A', min:1, max:2000, step:1, default:40},
      {key:'l', type:'number', label:'Longitud L', unit:'m', min:1, max:3000, step:1, default:30},
      {key:'cal', type:'select', label:'Calibre', default:'10 AWG', opts:COND.map(c=>({v:c.c,l:c.c}))},
      {key:'limite', type:'segment', label:'Límite', options:[{v:3,l:'3%'},{v:5,l:'5%'}], default:3},
    ],
    compute(a){
      const c = COND.find(x=>x.c===a.cal) || COND[9];
      const k = a.sistema==='tri' ? Math.sqrt(3) : 2;
      const Lkm = a.l/1000;
      const Z = Math.sqrt(c.r*c.r + c.xl*c.xl);
      const pct = (k*a.i*Lkm*Z)/a.vn*100;
      const dV = pct/100*a.vn;
      const Vc = a.vn - dV;
      const cumple = pct <= a.limite;
      return {c,k,Z,pct,dV,Vc,cumple,a};
    },
    formula(r){
      const ksym = r.a.sistema==='tri' ? '√3' : '2';
      return {
        simbolica:'e% = (k × I × L_km × Z) / Vn × 100',
        sustitucion:`e% = (${ksym} × ${r.a.i}A × ${fmt(r.a.l/1000,3)}km × ${fmt(r.Z,3)}Ω/km) / ${r.a.vn}V × 100 = ${fmt(r.pct,2)}%`,
        norma:'NOM-001-SEDE-2012 — Tabla 9 (método de impedancia, conduit acero, Cu, 75°C, 60Hz).',
        pendiente:'Z se calcula aquí como √(R²+XL²). Está pendiente de validar contra Z = R·cosθ + XL·senθ, que es el método de Tabla 9 más preciso — la versión actual puede sobreestimar Z (y por tanto la caída) hasta ~15%. No cambies decisiones de campo solo por este número sin margen.'
      };
    },
    renderResult(r){
      return {
        sev:r.cumple?'ok':'danger', badge:r.cumple?'CUMPLE':'NO CUMPLE',
        big:{lbl:'Caída de tensión', val:fmt(r.pct,2), u:'%', sub:`ΔV ${fmt(r.dV,2)}V · Vc ${fmt(r.Vc,1)}V`},
        rows:[
          ['Conductor', r.c.c],
          ['Z (Tabla 9)', fmt(r.Z,3)+' Ω/km'],
          ['R / XL', fmt(r.c.r,3)+' / '+fmt(r.c.xl,3)+' Ω/km'],
          ['Límite aplicable', r.a.limite+'%'],
        ],
        note:'Método de impedancia — NOM-001-SEDE-2012 Tabla 9, conduit acero, Cu, 75°C, 60Hz.'
      };
    }
  },

  ampacidad: {
    id:'ampacidad', label:'Ampacidad / calibre', ic:'🔌', tc:'#3b82f6', tcbg:'rgba(59,130,246,.12)',
    desc:'Calibre mínimo — NOM-001 310-15',
    info:'Busca el calibre más pequeño cuya ampacidad base (Tabla 310-15(b)(16) a 75°C) corregida por temperatura ambiente y por número de conductores agrupados sea ≥ tu corriente de diseño: base × F.temp × F.inst ≥ I. Charola escalerilla/lisa usa un factor fijo simplificado (0.75/0.65) — para instalaciones grandes en charola, verifica la tabla completa del Art. 392.',
    fields:[
      {key:'i', type:'number', label:'Corriente I', unit:'A', min:1, max:2000, step:1, default:40},
      {key:'mat', type:'segment', label:'Material', options:[{v:'cu',l:'Cobre'},{v:'al',l:'Aluminio'}], default:'cu'},
      {key:'inst', type:'choice', label:'Instalación', options:[{v:'conduit',l:'Conduit'},{v:'esc',l:'Charola esc.'},{v:'liso',l:'Charola lisa'}], default:'conduit'},
      {key:'n', type:'number', label:'N° conductores', unit:'cond.', min:1, max:60, step:1, default:3, show:a=>a.inst==='conduit'},
      {key:'temp', type:'select', label:'Temp. ambiente', default:30, opts:FTEMP.map(t=>({v:t.t,l:t.t+'°C'}))},
    ],
    compute(a){
      const Ftemp = (FTEMP.find(t=>t.t==a.temp)||FTEMP[0]).f;
      const Finst = a.inst==='conduit' ? factorAgrup(a.n||3) : (a.inst==='esc'?0.75:0.65);
      let pick=null;
      for(const c of COND){
        const base=a.mat==='cu'?c.cu:c.al; if(!base) continue;
        const raw=base*Ftemp*Finst;
        // Art. 240-4(d): 14/12/10 AWG Cu no pasan de 15/20/30 A de protección → se topa la ampacidad utilizable
        const corr=(a.mat==='cu' && c.cap) ? Math.min(raw,c.cap) : raw;
        if(corr>=a.i){ pick={c,base,corr,raw,topado:corr<raw}; break; }
      }
      return {pick, Ftemp, Finst, a};
    },
    formula(r){
      const p = r.pick;
      return {
        simbolica:'Amp_corregida = Amp_base × F_temp × F_inst  —  elegir el calibre más pequeño donde Amp_corregida ≥ I_diseño',
        sustitucion: p
          ? `Amp_corregida = ${p.base}A × ${r.Ftemp} × ${r.Finst} = ${fmt(p.raw,1)}A`
            + (p.topado ? `  →  topada a ${p.c.cap}A por Art. 240-4(d)` : '')
            + `  →  ${fmt(p.corr,1)}A ≥ ${r.a.i}A ✓  →  calibre ${p.c.c}`
          : `Ningún calibre de la tabla cumple ${r.a.i}A con estos factores (temp ${r.a.temp}°C, inst. ${r.a.inst}).`,
        norma:'NOM-001-SEDE-2012 — Tabla 310-15(b)(16), factores 310-15(b)(2)(a) [temperatura] y 310-15(b)(3)(a) [agrupamiento]. Cobre 14/12/10 AWG: tope de protección 15/20/30 A según Art. 240-4(d).'
      };
    },
    renderResult(r){
      if(!r.pick) return {sev:'danger', badge:'FUERA DE TABLA', big:{lbl:'Calibre',val:'—',u:'',sub:'Considera conductores en paralelo — Art. 310-4'}, rows:[], note:''};
      const p=r.pick;
      return {
        sev:'ok', badge:'ENCONTRADO',
        big:{lbl:'Calibre mínimo', val:p.c.c, u:'', sub:`Corregida ${fmt(p.corr,1)}A ≥ diseño ${r.a.i}A`},
        rows:[
          ['Ampacidad base (75°C)', p.base+' A'],
          ['Factor temperatura', '×'+r.Ftemp],
          ['Factor instalación', '×'+r.Finst],
          ['Material', r.a.mat==='cu'?'Cobre':'Aluminio'],
        ],
        note: p.topado
          ? {warn:true, txt:`Ampacidad topada a ${p.c.cap} A (Art. 240-4(d)): la protección de ${p.c.c} Cu no puede exceder ese valor, aunque la tabla y los factores den ${fmt(p.raw,1)} A. Criterio: base × F.temp × F.inst ≥ I diseño — NOM-001 310-15(b).`}
          : 'Criterio: base × F.temp × F.inst ≥ I diseño — NOM-001 310-15(b).'
      };
    }
  },

  motor: {
    id:'motor', label:'Motor eléctrico', ic:'⚙️', tc:'#f97316', tcbg:'rgba(249,115,22,.12)',
    desc:'FLC / arranque — NOM-001 Art. 430',
    info:'Cable y breaker se calculan con la FLC de TABLA (Art. 430-6(a)): Tabla 430-250 en trifásico, 430-248 en monofásico — nunca con la placa ni con una corriente calculada. El cable va al 125% (Art. 430-22) y el breaker al 250% como máximo para tiempo inverso (Art. 430-52). El guardamotor/relevador se ajusta al FLA de placa si lo capturas (Art. 430-32); si no, se deja en la FLC de tabla como referencia. Si la tensión o los HP no caen en la tabla cargada, el módulo usa una corriente estimada (FP 0.85, η 0.90) y lo avisa. Si das kW, se pasa a HP y se toma el renglón de tabla de esa potencia (tolerancia 4 %, por los pares comerciales kW↔HP como 90 kW ≈ 125 HP); si no existe el HP exacto se toma el siguiente mayor.',
    fields:[
      {key:'punit', type:'segment', label:'Unidad', options:[{v:'hp',l:'HP'},{v:'kw',l:'kW'}], default:'hp'},
      {key:'p', type:'number', label:'Potencia', unit:a=>a.punit==='hp'?'HP':'kW', min:0.25, max:1000, step:0.5, default:10},
      {key:'sistema', type:'segment', label:'Sistema', options:[{v:'tri',l:'Trifásico'},{v:'mono',l:'Monofásico'}], default:'tri'},
      {key:'v', type:'number', label:'Tensión V', unit:'V', min:110, max:600, step:1, default:440},
      {key:'arranque', type:'choice', label:'Arranque', options:[{v:'dol',l:'DOL'},{v:'yd',l:'Y-Δ'},{v:'vfd',l:'VFD'},{v:'soft',l:'Soft'}], default:'dol'},
      {key:'tieneplaca', type:'segment', label:'FLA de placa', options:[{v:'no',l:'No — usar calc.'},{v:'si',l:'Sí — capturar'}], default:'no'},
      {key:'fla', type:'number', label:'FLA placa', unit:'A', min:0.1, max:2000, step:0.1, default:20, show:a=>a.tieneplaca==='si'},
    ],
    compute(a){
      const kw = a.punit==='hp' ? a.p*0.7457 : a.p;
      const FP=0.85, eff=0.90;
      const Iest = a.sistema==='tri' ? (kw*1000)/(Math.sqrt(3)*a.v*FP*eff) : (kw*1000)/(a.v*FP*eff);
      const hpCalc = kw/0.7457;
      const T = motorFlcTabla(a.sistema, a.v, hpCalc);   // Art. 430-6(a): conductor y protección con FLC de tabla
      const I = T.ok ? T.I : Iest;
      const FLA = a.tieneplaca==='si' ? a.fla : I;
      const mult = ARRANQUE[a.arranque];
      const Ia = I*mult.ia;
      const brk = roundStd(I*2.50);
      const cableI = I*1.25;
      let cable=null; for(const c of COND){ if(c.cu>=cableI){ cable=c; break; } }
      return {kw,I,Iest,T,hpCalc,FLA,mult,Ia,brk,cable,cableI,a};
    },
    formula(r){
      const kdenom = r.a.sistema==='tri' ? '√3×V×FP×η' : 'V×FP×η';
      const T=r.T;
      const flcTxt = T.ok
        ? `FLC (Tabla ${T.tabla}, ${T.hp} HP, col. ${T.colTxt}) = ${fmt(r.I,1)}A`
        : `FLC ESTIMADA = (${fmt(r.kw,2)}×1000)/(${r.a.sistema==='tri'?'√3×':''}${r.a.v}×0.85×0.90) = ${fmt(r.I,1)}A  (${T.motivo})`;
      return {
        simbolica: T.ok
          ? `FLC = valor de Tabla ${T.tabla}  |  Cable ≥ FLC×1.25  |  Breaker = FLC×2.50  |  Ir(guardamotor) = FLA de placa`
          : `FLC estimada = (kW×1000)/(${kdenom})  |  Cable ≥ FLC×1.25  |  Breaker = FLC×2.50  |  Ir(guardamotor) = FLA de placa`,
        sustitucion:`${flcTxt}  →  Cable: ${fmt(r.I,1)}×1.25 = ${fmt(r.cableI,1)}A → ${r.cable?r.cable.c:'—'}  |  Breaker: ${fmt(r.I,1)}×2.50 = ${fmt(r.I*2.5,1)}A → ${r.brk}A`,
        norma:'NOM-001-SEDE-2012 — Art. 430-6(a) (FLC de tabla para conductor y protección), Tablas 430-250 / 430-248, Art. 430-22 (conductor 125%), Tabla 430-52 (protección 250% DOL/Y-Δ, máximo), Art. 430-32 (sobrecarga 115-125% FLA placa).'+(T.ok?'':' La FLC estimada con FP=0.85/η=0.90 NO es de tabla: sirve solo como orientación.')
      };
    },
    renderResult(r){
      const T=r.T, sis=r.a.sistema==='tri'?'Trifásico':'Monofásico';
      return {
        sev:T.ok?'ok':'warn', badge:T.ok?('TABLA '+T.tabla):'ESTIMADO · SIN TABLA',
        big:{lbl:T.ok?('FLC de tabla ('+T.tabla+')'):'Corriente diseño (ESTIMADA)', val:fmt(r.I,1), u:'A',
             sub:T.ok ? `${fmt(r.kw,2)}kW ≈ ${T.hp} HP · ${sis} ${r.a.v}V · col. ${T.col.replace('v','')} V${T.exacto?'':' · HP superior'}` : `${fmt(r.kw,2)}kW · ${sis} ${r.a.v}V · FP.85/η.90`},
        rows:[
          [`Arranque (${r.mult.label})`, `Ia≈${fmt(r.Ia,1)}A`],
          ['Breaker mín. (250%)', r.brk+' A'],
          ['Cable (125%→calibre)', r.cable?r.cable.c:'—'],
          ['Guardamotor Ir', fmt(r.FLA,1)+' A'],
        ],
        note: !T.ok
          ? {warn:true, txt:`SIN FLC DE TABLA: ${T.motivo}. Cable y breaker salen de una corriente estimada (FP 0.85, η 0.90); verifica en la Tabla ${T.tabla} de la NOM antes de instalar.`}
          : (r.a.tieneplaca==='no'
              ? {warn:true, txt:'Guardamotor puesto en la FLC de tabla, no en placa. Ajusta al FLA real en cuanto tengas el motor — Art. 430-32.'}
              : 'Cable y breaker con FLC de tabla (Art. 430-6(a)); guardamotor ajustado al FLA de placa — Art. 430-32.')
      };
    }
  },

  conduit: {
    id:'conduit', label:'Llenado de conduit', ic:'○', tc:'#39d178', tcbg:'rgba(57,209,120,.12)',
    desc:'% área — NOM-001 Cap.10',
    info:'Compara el área ocupada por los conductores (con su diámetro exterior THHN) contra el área interior del conduit elegido (tabla EMT/IMC/RGS/PVC), aplicando el límite de llenado de la Tabla 1: 53% para 1 conductor, 31% para 2, 40% para 3 o más.',
    fields:[
      {key:'cal', type:'select', label:'Calibre', default:'12 AWG', opts:COND.filter(c=>COND_OD_THHN[c.mm2]).map(c=>({v:c.c,l:c.c}))},
      {key:'n', type:'number', label:'N° conductores', unit:'cond.', min:1, max:60, step:1, default:3},
      {key:'tipo', type:'select', label:'Tipo de conduit', default:'EMT', opts:Object.keys(CONDUIT_TABLES).map(k=>({v:k,l:CONDUIT_LABELS[k]}))},
      {key:'tam', type:'select', label:'Tamaño', default:'3/4"', opts:(a)=>CONDUIT_TABLES[a.tipo||'EMT'].map(c=>({v:c.n,l:c.n}))},
    ],
    compute(a){
      const c = COND.find(x=>x.c===a.cal);
      const OD = COND_OD_THHN[c.mm2] || (Math.sqrt(c.mm2/Math.PI)*2+4);
      const tabla = CONDUIT_TABLES[a.tipo||'EMT'];
      const cw = tabla.find(x=>x.n===a.tam) || tabla[0];
      const Atotal = Math.PI*Math.pow(cw.d/2,2);
      const areaCond = Math.PI*Math.pow(OD/2,2)*a.n;
      const limite = a.n===1?53:a.n===2?31:40;
      const pct = areaCond/Atotal*100;
      return {c,OD,cw,Atotal,areaCond,limite,pct,cumple:pct<=limite,a};
    },
    formula(r){
      return {
        simbolica:'A_conduit = π×(Ø_int/2)²  |  A_ocupada = π×(Ø_ext/2)² × n  |  % = (A_ocupada / A_conduit) × 100 ≤ límite',
        sustitucion:`A_conduit = π×(${fmt(r.cw.d,1)}/2)² = ${fmt(r.Atotal,1)}mm²  |  A_ocupada = π×(${fmt(r.OD,2)}/2)² × ${r.a.n} = ${fmt(r.areaCond,1)}mm²  |  % = ${fmt(r.areaCond,1)}/${fmt(r.Atotal,1)} × 100 = ${fmt(r.pct,1)}%`,
        norma:'NOM-001-SEDE-2012 — Cap. 10, Tabla 1 (límite: 53% 1 cond., 31% 2 cond., 40% 3+ cond.), Tabla 4 (Ø interior conduit), Tabla 5 (Ø exterior conductor).'
      };
    },
    renderResult(r){
      return {
        sev:r.cumple?'ok':'danger', badge:r.cumple?'CUMPLE':'EXCEDE',
        big:{lbl:'% de llenado', val:fmt(r.pct,1), u:'%', sub:`${r.a.n}× ${r.c.c} en ${CONDUIT_LABELS[r.a.tipo]||r.a.tipo} ${r.a.tam}`},
        rows:[
          ['Área interior conduit', fmt(r.Atotal,1)+' mm²'],
          ['Área ocupada', fmt(r.areaCond,1)+' mm²'],
          ['Ø exterior conductor', fmt(r.OD,2)+' mm'],
          ['Límite (n='+r.a.n+')', r.limite+'%'],
        ],
        note:'NOM-001 Tabla 1: 1 cond=53% · 2 cond=31% · 3+ cond=40%.'
      };
    }
  },

  xfmr: {
    id:'xfmr', label:'Transformador', ic:'🔄', tc:'#8b5cf6', tcbg:'rgba(139,92,246,.12)',
    desc:'Corrientes/protección — Art. 450',
    info:'Calcula la corriente de línea en primario y secundario (I=kVA×1000/(√3×V) en trifásico), dimensiona la protección al 125% si solo hay del lado primario, o 250%/125% si hay en ambos lados (Art. 450). Estima el inrush como 10× la corriente nominal de secundario, y aproxima el %VR con una %Z típica por rango de potencia y FP=0.85 asumido — para %Z real, siempre usa el dato de placa del transformador.',
    fields:[
      {key:'kva', type:'number', label:'Potencia', unit:'kVA', min:1, max:2500, step:1, default:75},
      {key:'sistema', type:'segment', label:'Tipo', options:[{v:'tri',l:'Trifásico'},{v:'mono',l:'Monofásico'}], default:'tri'},
      {key:'vp', type:'number', label:'Tensión Vp', unit:'V', min:110, max:15000, step:1, default:480},
      {key:'vs', type:'number', label:'Tensión Vs', unit:'V', min:12, max:600, step:1, default:220},
      {key:'proteccion', type:'choice', label:'Protección', options:[{v:'solo',l:'Solo primaria'},{v:'ambas',l:'Primaria+sec.'}], default:'solo'},
    ],
    compute(a){
      const Ip = a.sistema==='tri' ? (a.kva*1000)/(Math.sqrt(3)*a.vp) : (a.kva*1000)/a.vp;
      const Is = a.sistema==='tri' ? (a.kva*1000)/(Math.sqrt(3)*a.vs) : (a.kva*1000)/a.vs;
      let Bp,Bs;
      if(a.proteccion==='solo'){ Bp=roundStd(Ip*1.25); Bs=null; } else { Bp=roundStd(Ip*2.50); Bs=roundStd(Is*1.25); }
      const inrush = Is*10;
      const z = zDefault(a.kva), R=z*0.30, X=z*0.95, FP=0.85, sinphi=Math.sqrt(1-FP*FP);
      const vr = R*FP + X*sinphi;
      return {Ip,Is,Bp,Bs,inrush,z,R,X,FP,sinphi,vr,a};
    },
    formula(r){
      const protTxt = r.a.proteccion==='solo'
        ? `Bp = Ip×1.25 = ${fmt(r.Ip,1)}×1.25 = ${r.Bp}A (solo primaria)`
        : `Bp = Ip×2.50 = ${fmt(r.Ip,1)}×2.50 = ${r.Bp}A  |  Bs = Is×1.25 = ${fmt(r.Is,1)}×1.25 = ${r.Bs}A`;
      return {
        simbolica:'Ip = (kVA×1000)/(√3×Vp)  |  Protección: sola=125%Ip · con secundaria=250%Ip/125%Is  |  Inrush≈10×Is  |  %VR≈%R×FP+%X×senφ',
        sustitucion:`Ip = (${r.a.kva}×1000)/(√3×${r.a.vp}) = ${fmt(r.Ip,1)}A.  ${protTxt}.  Inrush = 10×${fmt(r.Is,1)} = ${fmt(r.inrush,0)}A.  %VR = ${fmt(r.R,2)}×${r.FP} + ${fmt(r.X,2)}×${fmt(r.sinphi,2)} = ${fmt(r.vr,2)}%`,
        norma:'NOM-001-SEDE-2012 — Art. 450, Tabla 450-3(b). %VR es aproximación lineal a partir de %Z de placa (%R≈%Z×0.30, %X≈%Z×0.95), no un valor de tabla — el %Z real de placa siempre tiene prioridad.'
      };
    },
    renderResult(r){
      const rows=[['Protección primario', r.Bp+' A']];
      if(r.Bs) rows.push(['Protección secundario', r.Bs+' A']);
      rows.push(['Inrush estimado (10×Is)', fmt(r.inrush,0)+' A']);
      rows.push(['%VR estimado (%Z≈'+r.z+'%)', fmt(r.vr,2)+'%']);
      return {
        sev:'ok', badge:'CALCULADO',
        big:{lbl:'Corriente secundario', val:fmt(r.Is,1), u:'A', sub:`Primario ${fmt(r.Ip,1)}A · ${r.a.kva}kVA`},
        rows, note:'Breaker tipo D en primario para tolerar inrush. %VR con FP=0.85 asumido.'
      };
    }
  },

  caps: {
    id:'caps', label:'Banco de Capacitores', ic:'⚡', tc:'#eab308', tcbg:'rgba(234,179,8,.12)',
    desc:'Corrección de FP', historial:true,
    info:'Corrección de factor de potencia por triángulo de potencias: kVAR = kW×(tan(φ1)-tan(φ2)), redondeado al tamaño comercial más cercano. Muestra la reducción de corriente de línea resultante. Si hay VFDs en la red, advierte sobre resonancia con armónicos y la necesidad de un reactor de bloqueo (detuned) — nunca instales capacitores fijos cerca de VFDs sin ese reactor.',
    fields:[
      {key:'kw', type:'number', label:'Potencia activa', unit:'kW', min:1, max:5000, step:1, default:100},
      {key:'fp1', type:'number', label:'FP actual', unit:'', min:0.5, max:0.99, step:0.01, default:0.80},
      {key:'fp2', type:'segment', label:'FP deseado', options:[{v:0.90,l:'0.90'},{v:0.95,l:'0.95'},{v:1.00,l:'1.00'}], default:0.95},
      {key:'v', type:'number', label:'Tensión sistema', unit:'V', min:110, max:15000, step:1, default:440},
      {key:'vfd', type:'segment', label:'¿VFDs en la red?', options:[{v:'no',l:'No'},{v:'si',l:'Sí'}], default:'no'},
    ],
    compute(a){
      const phi1 = Math.acos(a.fp1), phi2 = Math.acos(a.fp2);
      const kvarNecesarios = a.kw*(Math.tan(phi1)-Math.tan(phi2));
      const kvarComercial = roundStdKvar(kvarNecesarios);
      const kvaAntes = a.kw/a.fp1, kvaDespues = a.kw/a.fp2;
      const iAntes = kvaAntes*1000/(Math.sqrt(3)*a.v);
      const iDespues = kvaDespues*1000/(Math.sqrt(3)*a.v);
      const reduccion = (1-iDespues/iAntes)*100;
      const kvarResidual = a.kw*Math.tan(phi1) - kvarComercial;
      const kvaReal = Math.sqrt(a.kw*a.kw + kvarResidual*kvarResidual);
      const fpReal = a.kw/kvaReal;
      return {kvarNecesarios,kvarComercial,kvaAntes,kvaDespues,iAntes,iDespues,reduccion,fpReal,phi1,phi2,a};
    },
    formula(r){
      return {
        simbolica:'kVAR = kW × (tanφ1 − tanφ2)   donde φ = arccos(FP)',
        sustitucion:`φ1=arccos(${r.a.fp1})=${fmt(r.phi1*180/Math.PI,1)}°, φ2=arccos(${r.a.fp2})=${fmt(r.phi2*180/Math.PI,1)}°  →  kVAR = ${r.a.kw} × (tan${fmt(r.phi1*180/Math.PI,1)}° − tan${fmt(r.phi2*180/Math.PI,1)}°) = ${fmt(r.kvarNecesarios,1)} kVAR  →  comercial ${r.kvarComercial} kVAR`,
        norma:'Triángulo de potencias — no es cálculo de tabla NOM-001, es relación trigonométrica estándar de corrección de FP. Con VFDs en la red, agregar reactor de bloqueo (detuned) — ver nota de resultado.'
      };
    },
    renderResult(r){
      const rows=[
        ['FP real alcanzado', fmt(r.fpReal,2)],
        ['Corriente antes → después', fmt(r.iAntes,1)+' → '+fmt(r.iDespues,1)+' A'],
        ['Reducción de corriente', fmt(r.reduccion,1)+'%'],
      ];
      let note = {warn:false, txt:'kVAR real escala con (V_real/V_nominal)² — verifica tensión real vs placa del banco.'};
      if(r.a.vfd==='si') note = {warn:true, txt:'⚠ Hay VFDs: usar reactor de bloqueo (detuned 5.67% o 7%) — sin él, riesgo de resonancia con armónicos y falla del banco. kVAR real escala con (V_real/V_nominal)² — verifica tensión real vs placa.'};
      return {
        sev: r.a.vfd==='si' ? 'warn' : 'ok', badge: r.a.vfd==='si' ? 'VER ADVERTENCIA' : 'CALCULADO',
        big:{lbl:'Banco comercial recomendado', val:fmt(r.kvarComercial,1), u:'kVAR', sub:`${r.a.kw}kW · FP ${r.a.fp1}→${r.a.fp2} · ${r.a.v}V`},
        rows, note
      };
    },
    summary(r){ return `${fmt(r.kvarComercial,1)} kVAR · FP ${r.a.fp1}→${r.a.fp2} · ${r.a.v}V${r.a.vfd==='si'?' · ⚠ VFD':''}`; }
  },

  ups: {
    id:'ups', label:'UPS — Autonomía/Batería', ic:'🔋', tc:'#0ea5e9', tcbg:'rgba(14,165,233,.12)',
    desc:'Dimensionamiento UPS y banco', historial:true,
    info:'Dimensiona la capacidad de UPS a partir de la carga en VA con margen de crecimiento, y calcula autonomía (a partir de los Ah de tu banco) o Ah necesarios (a partir de la autonomía deseada), según el modo. La corriente de descarga considera la eficiencia del inversor. La vida útil de baterías plomo-ácido cae a la mitad por cada 8-10°C sobre 25°C — clave si el UPS va en un cuarto caliente.',
    fields:[
      {key:'modo', type:'segment', label:'Calcular', options:[{v:'auto',l:'Autonomía'},{v:'ah',l:'Ah necesarios'}], default:'auto'},
      {key:'w', type:'number', label:'Carga total', unit:'W', min:10, max:20000, step:10, default:500},
      {key:'fpc', type:'number', label:'FP de la carga', unit:'', min:0.5, max:1.0, step:0.01, default:0.70},
      {key:'margen', type:'segment', label:'Margen crecim.', options:[{v:0,l:'0%'},{v:0.20,l:'20%'},{v:0.30,l:'30%'}], default:0.20},
      {key:'ah', type:'number', label:'Ah del banco', unit:'Ah', min:1, max:2000, step:1, default:100, show:a=>a.modo==='auto'},
      {key:'tmin', type:'number', label:'Autonomía deseada', unit:'min', min:1, max:480, step:1, default:10, show:a=>a.modo==='ah'},
      {key:'vdc', type:'number', label:'Tensión banco DC', unit:'V', min:6, max:400, step:1, default:24},
      {key:'bat', type:'segment', label:'Tipo batería', options:[{v:0.5,l:'Plomo-ácido'},{v:0.8,l:'Litio'}], default:0.5},
      {key:'eta', type:'number', label:'Eficiencia inversor', unit:'', min:0.7, max:0.99, step:0.01, default:0.90},
    ],
    compute(a){
      const vaCarga = a.w/a.fpc;
      const kvaRecomendado = roundStdKva((vaCarga*(1+a.margen))/1000);
      let autoninMin=null, ahNecesarios=null;
      if(a.modo==='auto'){ autoninMin = ((a.ah*a.vdc*a.bat*a.eta)/a.w)*60; }
      else { ahNecesarios = (a.w*(a.tmin/60))/(a.vdc*a.bat*a.eta); }
      const iDescarga = (a.w/a.eta)/a.vdc;
      return {vaCarga,kvaRecomendado,autoninMin,ahNecesarios,iDescarga,a};
    },
    formula(r){
      const batLbl = r.a.bat==0.8?'Litio (K=0.8)':'Plomo-ácido (K=0.5)';
      const sustitucion = r.a.modo==='auto'
        ? `Autonomía(min) = (Ah × Vdc × K × η / W) × 60 = (${r.a.ah} × ${r.a.vdc} × ${r.a.bat} × ${r.a.eta} / ${r.a.w}) × 60 = ${fmt(r.autoninMin,1)} min`
        : `Ah = (W × t_min/60) / (Vdc × K × η) = (${r.a.w} × ${r.a.tmin}/60) / (${r.a.vdc} × ${r.a.bat} × ${r.a.eta}) = ${fmt(r.ahNecesarios,1)} Ah`;
      return {
        simbolica: r.a.modo==='auto'
          ? 'Autonomía(min) = (Ah × Vdc × K_bat × η_inversor / W) × 60'
          : 'Ah = (W × t_min/60) / (Vdc × K_bat × η_inversor)',
        sustitucion: sustitucion + `  |  I_descarga = (W/η)/Vdc = (${r.a.w}/${r.a.eta})/${r.a.vdc} = ${fmt(r.iDescarga,2)}A`,
        norma:`Cálculo de ingeniería de dimensionamiento UPS/batería (no es tabla NOM-001). K_bat=${batLbl} es factor de referencia interno del proyecto, no valor normativo — confirmar contra hoja de datos del fabricante.`
      };
    },
    renderResult(r){
      const principal = r.a.modo==='auto'
        ? {lbl:'Autonomía estimada', val:fmt(r.autoninMin,1), u:'min'}
        : {lbl:'Ah necesarios', val:fmt(r.ahNecesarios,1), u:'Ah'};
      return {
        sev:'ok', badge:'UPS '+r.kvaRecomendado+' kVA',
        big:{lbl:principal.lbl, val:principal.val, u:principal.u, sub:`${r.a.w}W · FP ${r.a.fpc} · ${r.a.vdc}V DC`},
        rows:[
          ['Capacidad UPS recomendada', r.kvaRecomendado+' kVA'],
          ['VA de carga (con margen)', fmt(r.vaCarga*(1+r.a.margen),0)+' VA'],
          ['Corriente de descarga', fmt(r.iDescarga,2)+' A'],
        ],
        note:'Vida de batería plomo-ácido cae a la mitad cada 8-10°C sobre 25°C. Online (doble conversión) recomendado cerca de VFDs.'
      };
    },
    summary(r){
      const principal = r.a.modo==='auto' ? `${fmt(r.autoninMin,1)} min` : `${fmt(r.ahNecesarios,1)} Ah`;
      return `${principal} · ${r.a.w}W · ${r.a.vdc}V DC · UPS ${r.kvaRecomendado}kVA`;
    }
  }
};

// Conjuntos de conversión lineal (factor a unidad base)
const CONV_SETS = {
  power:    { factors:{hp:0.7457, kw:1}, labels:{hp:'HP', kw:'kW'}, dec:{hp:2,kw:3} },
  torque:   { factors:{nm:1, lbft:1.35582, kgfcm:0.0980665}, labels:{nm:'N·m', lbft:'lb-ft', kgfcm:'kgf·cm'}, dec:{nm:2,lbft:2,kgfcm:1} },
  pressure: { factors:{bar:1, psi:0.0689476, kpa:0.01, kgcm2:0.980665}, labels:{bar:'bar', psi:'psi', kpa:'kPa', kgcm2:'kg/cm²'}, dec:{bar:3,psi:2,kpa:2,kgcm2:3} },
  length:   { factors:{m:1, ft:0.3048, in:0.0254}, labels:{m:'m', ft:'ft', in:'in'}, dec:{m:3,ft:2,in:2} },
  lux:      { factors:{lux:1, fc:10.764}, labels:{lux:'lux', fc:'fc'}, dec:{lux:0,fc:1} },
};

function convCompute(setKey){
  const set = CONV_SETS[setKey];
  const st = ST.conv.vals[setKey];
  if(st.v===''||st.v===null||st.v===undefined||isNaN(st.v)) return null;
  const base = st.v * set.factors[st.u];
  const out = {};
  Object.keys(set.factors).forEach(u=>{ out[u] = base / set.factors[u]; });
  return out;
}

/* ---- Salidas del conversor: bloques aislados con id propio.
   Se regeneran solo ellos al teclear (ver App.convSet*), nunca el
   <input> — así el input nunca pierde foco/teclado ni se le
   reescribe el value a medio tecleo (lo que borraba el punto decimal). */
function convOutRowsHtml(setKey){
  const set = CONV_SETS[setKey];
  const st = ST.conv.vals[setKey];
  const out = convCompute(setKey);
  return out
    ? Object.keys(set.factors).filter(u=>u!==st.u).map(u=>`<div class="row"><div class="k">${set.labels[u]}</div><div class="v">${fmt(out[u], set.dec[u])}</div></div>`).join('')
    : '<div class="row"><div class="k">—</div><div class="v">—</div></div>';
}

// Convierte una medida comercial de conduit ('1-1/4"', '1/2"', '2"'...) a pulgadas decimales
function conduitSizeToIn(label){
  const s = label.replace('"','').trim();
  const parts = s.split('-');
  const fracPart = parts[parts.length-1];
  const whole = parts.length===2 ? parseFloat(parts[0]) : 0;
  let frac;
  if(fracPart.includes('/')){ const [n,d] = fracPart.split('/').map(Number); frac = n/d; }
  else { frac = parseFloat(fracPart); }
  return whole + frac;
}

  const st = ST.conv.vals.cable;
  const inDec = conduitSizeToIn(st.condSize);
  const mm = inDec*25.4;
  return `<div class="row"><div class="k">Pulgada decimal</div><div class="v">${fmt(inDec,3)}"</div></div>
  <div class="row"><div class="k">Milímetros</div><div class="v">${fmt(mm,2)} mm</div></div>`;
}

function initConvTabScroll(){

  if(!wrap || !scroller) return;
  const active = scroller.querySelector('.fchoice.active');
  if(active && typeof active.scrollIntoView==='function') active.scrollIntoView({inline:'nearest', block:'nearest'});

/* =================================================================
   MÓDULO · ITM PRINCIPAL DE TABLERO MULTIMOTOR
   Art. 430-24 (alimentador), 430-52 (ramal), 430-62 (máximo del alimentador)
   ================================================================= */
// Tabla 430-52 — % máximo de la FLC de tabla para el dispositivo de cortocircuito y falla a tierra del ramal.
// PENDIENTE DE VERIFICAR: esta tabla NO está en las capturas del PDF. El 250 % (tiempo inverso) lo indicó el usuario en su caso de prueba;
// los demás porcentajes son de referencia y NO están confirmados contra la NOM. Poner ITM_PEND_430_52=false solo después de compararlos con la foto.
const ITM_PEND_430_52 = true;
const ITM_PEND_240_6  = true;   // lista de comerciales (STD_AMPS 15–1200 A) sin captura del Art. 240-6
const ITM_TIPOS = {
  inv:    {l:'Termomagnético tiempo inverso', pct:250},
  inst:   {l:'Instantáneo / guardamotor',     pct:800},
  fusret: {l:'Fusible con retardo',           pct:175},
  fussin: {l:'Fusible sin retardo',           pct:300},
};
const ITM_VOLTS = [208,230,460,575];
const ITM_MAX_MOTORES = 12, ITM_MAX_EXTRAS = 4;
const r2 = x => Math.round(x*100)/100;
function itmFloorStd(a){ let r=null; for(const s of STD_AMPS){ if(s<=a) r=s; else break; } return r; }
function itmMotor(hp,v,tipo,vfd){ return {hp:hp, v:v, fla:'', tipo:tipo||'inv', vfd:!!vfd, ivfd:''}; }
function itmDefault(){
  // Precarga = caso de prueba (460 V): 2, 3, 2, 3, 3, 5 HP y un 2 HP con VFD
  return {vsis:460, term:75, copiado:false,
    motores:[itmMotor(2,460),itmMotor(3,460),itmMotor(2,460),itmMotor(3,460),itmMotor(3,460),itmMotor(5,460),itmMotor(2,460,'inv',true)],
    extras:[]};
}

function itmCalc(S){
  const R={ok:false, err:[], av:[], motores:[], extras:[], S:S};
  const vs=+S.vsis;
  if(!S.motores.length){ R.err.push('Agrega al menos un motor.'); return R; }
  S.motores.forEach((m,i)=>{
    const hp=+m.hp, v=+m.v;
    const T=motorFlcTabla('tri', v, hp);
    const row={n:i+1, hp:hp, v:v, tipo:m.tipo, vfd:!!m.vfd, T:T, flc:null, iuso:null, dev:null, devCalc:null, pct:null, fla:null, ivfd:null};
    R.motores.push(row);
    if(!T.ok){ R.err.push('M'+(i+1)+' ('+hp+' HP, '+v+' V): '+T.motivo+'. PENDIENTE DE VERIFICAR.'); return; }
    row.flc=T.I; row.col=T.colTxt;
    const fla=parseFloat(m.fla); row.fla=(isFinite(fla)&&fla>0)?fla:null;
    const iv=parseFloat(m.ivfd);  row.ivfd=(m.vfd&&isFinite(iv)&&iv>0)?iv:null;
    row.iuso = row.ivfd!=null ? row.ivfd : row.flc;
    if(row.ivfd==null){
      const pct=ITM_TIPOS[m.tipo].pct; row.pct=pct; row.devCalc=r2(row.flc*pct/100); row.dev=roundStd(row.devCalc);
    }
    if(row.fla!=null && row.fla>row.flc) R.av.push('M'+(i+1)+': el FLA de placa ('+fmt(row.fla,1)+' A) es mayor que la FLC de tabla ('+fmt(row.flc,1)+' A). El alimentador se dimensiona con la tabla (Art. 430-6(a)), pero revisa el motor y el ajuste del guardamotor (Art. 430-32).');
    if(v!==vs) R.av.push('M'+(i+1)+': su tensión ('+v+' V) no es la del sistema ('+vs+' V). Todos los motores de un mismo alimentador deben ser de la tensión del sistema.');
    if(m.vfd && row.ivfd==null) R.av.push('M'+(i+1)+' (VFD): se usó la FLC de tabla del motor. El alimentador de un VFD se dimensiona con la corriente de ENTRADA de placa del variador: captúrala en el renglón. PENDIENTE DE VERIFICAR el artículo en tu PDF (430-6(a)(2) / 430-122).');
    if(m.vfd && row.ivfd!=null) R.av.push('M'+(i+1)+' (VFD): se usó la corriente de entrada de placa ('+fmt(row.ivfd,1)+' A). La protección de ramal de ese variador es la que indique el fabricante: no se calcula con 430-52 y no entra como "dispositivo mayor". PENDIENTE DE VERIFICAR el artículo en tu PDF.');
  });
  S.extras.forEach((e,i)=>{
    const va=parseFloat(e.va), v=parseFloat(e.v);
    if(!(va>0 && v>0)){ R.err.push('Carga adicional '+(i+1)+': captura VA y tensión de primario mayores a 0.'); return; }
    const I=r2(e.f===3 ? va/(Math.sqrt(3)*v) : va/v);
    R.extras.push({n:i+1, va:va, v:v, f:(e.f===3?3:1), I:I});
  });
  if(R.err.length) return R;

  R.sumMot=r2(R.motores.reduce((s,m)=>s+m.iuso,0));
  R.sumExt=r2(R.extras.reduce((s,e)=>s+e.I,0));
  let kMax=0; R.motores.forEach((m,i)=>{ if(m.iuso>R.motores[kMax].iuso) kMax=i; });
  R.kMax=kMax; R.iMax=R.motores[kMax].iuso; R.resto=r2(R.sumMot-R.iMax);
  R.diseno=r2(1.25*R.iMax + R.resto + R.sumExt);

  const col = (+S.term===60) ? 'cu60' : 'cu';
  R.colTxt = (+S.term===60) ? '60 °C' : '75 °C';
  R.cond=null; for(const c of COND){ if(c[col]>=R.diseno){ R.cond=c; break; } }
  R.condAmp = R.cond ? R.cond[col] : null;

  let kDev=-1;
  R.motores.forEach((m,i)=>{
    if(m.dev==null) return;
    if(kDev<0 || m.dev>R.motores[kDev].dev || (m.dev===R.motores[kDev].dev && m.iuso>R.motores[kDev].iuso)) kDev=i;
  });
  if(kDev<0){ R.err.push('Ningún motor tiene dispositivo de ramal calculable por 430-52 (todos son VFD con corriente de entrada capturada). Sin dispositivo de ramal no se puede aplicar 430-62.'); return R; }
  R.kDev=kDev; R.devMax=R.motores[kDev].dev;
  R.restoDev=r2(R.sumMot-R.motores[kDev].iuso);
  R.max62=r2(R.devMax + R.restoDev + R.sumExt);
  R.itm=itmFloorStd(R.max62);
  R.itmOk=(R.itm!=null && R.itm>=R.diseno);
  if(kDev!==kMax && R.motores[kDev].iuso!==R.motores[kMax].iuso)
    R.av.push('El dispositivo de ramal mayor ('+R.devMax+' A, M'+(kDev+1)+') no es el del motor de mayor corriente (M'+(kMax+1)+'). Se aplicó 430-62 con el dispositivo de ramal mayor y se restó la FLC de ESE motor al sumar los demás. Confírmalo con tu PDF (decisión pendiente de tu revisión).');
  if(R.max62>1200 || R.devMax>1200) R.av.push('La lista de comerciales cargada llega a 1200 A (Art. 240-6 sin verificar). Valores mayores quedan fuera de esta herramienta.');
  if(vs>480) R.av.push('Sistema de '+vs+' V: excede los 480 V CA de tensión nominal del ITM de esta herramienta. Usa un ITM con tensión nominal suficiente.');
  if(!R.cond) R.av.push('Corriente de diseño fuera de la columna de '+R.colTxt+' cargada (más de '+COND[COND.length-1][col]+' A): considera conductores en paralelo.');
  if(R.itm==null) R.av.push('El máximo de 430-62 ('+fmt(R.max62,1)+' A) es menor que el comercial mínimo de la lista (15 A): no hay ITM que cumpla.');
  else if(!R.itmOk) R.av.push('NO existe un ITM comercial que cumpla ambas condiciones: el comercial inmediato por debajo del máximo ('+R.itm+' A) es MENOR que la corriente de diseño ('+fmt(R.diseno,1)+' A). Revisa: tipo de dispositivo de ramal, separar el tablero en dos alimentadores, o rediseñar. No se sugiere ITM.');
  if(R.cond && R.itmOk && R.itm>R.condAmp) R.av.push('El ITM ('+R.itm+' A) es mayor que la ampacidad del conductor ('+R.condAmp+' A a '+R.colTxt+'). Para alimentadores de motores 430-62 rige sobre la protección ordinaria del conductor; PENDIENTE DE VERIFICAR la redacción exacta (430-62 / 240-4) en tu PDF.');
  R.ok=true;
  return R;
}

function itmTexto(R){
  const S=R.S, L=[], pend=' [PENDIENTE DE VERIFICAR]';
  L.push('VoltRefMX · ITM principal de tablero multimotor');
  L.push('NOM-001-SEDE-2012 · Sistema '+S.vsis+' V · terminales '+S.term+' °C · '+new Date().toLocaleDateString('es-MX'));
  L.push('Redondeo: corrientes a 0.01 A; ramal = comercial inmediato SUPERIOR; ITM = comercial inmediato INFERIOR (≤) al máximo.');
  L.push('');
  if(!R.ok){ R.err.forEach(e=>L.push('ERROR: '+e)); return L.join('\n'); }
  L.push('RESUMEN');
  L.push('  Corriente de diseño (430-24): '+fmt(R.diseno,2)+' A');
  L.push('  Conductor mínimo (310-15(b)(16), Cu, '+R.colTxt+'): '+(R.cond?R.cond.c+' ('+R.condAmp+' A)':'fuera de tabla'));
  L.push('  Máximo del ITM (430-62): '+fmt(R.max62,2)+' A');
  L.push('  ITM sugerido: '+(R.itmOk?R.itm+' A':'NO EXISTE comercial que cumpla'));
  L.push('');
  L.push('1) FLC por motor — Tabla 430-250 (Art. 430-6(a))');
  R.motores.forEach(m=>L.push('  M'+m.n+': '+m.hp+' HP, '+m.v+' V, col. '+m.col+' = '+fmt(m.flc,2)+' A'+(m.ivfd!=null?' → VFD: se usa I entrada de placa '+fmt(m.ivfd,2)+' A':'')));
  L.push('  Suma de motores = '+fmt(R.sumMot,2)+' A');
  R.extras.forEach(e=>L.push('  Carga adicional '+e.n+': transformador '+fmt(e.va,0)+' VA / '+fmt(e.v,0)+' V ('+(e.f===3?'3φ':'1φ')+') = '+fmt(e.I,2)+' A'));
  if(R.extras.length) L.push('  Suma de cargas adicionales = '+fmt(R.sumExt,2)+' A');
  L.push('2) Corriente de diseño (Art. 430-24)');
  L.push('  = 1.25 × '+fmt(R.iMax,2)+' (mayor, M'+(R.kMax+1)+') + '+fmt(R.resto,2)+' (demás motores) + '+fmt(R.sumExt,2)+' (adicionales) = '+fmt(R.diseno,2)+' A');
  L.push('3) Conductor mínimo (Art. 310, Tabla 310-15(b)(16), Cu, columna '+R.colTxt+')');
  L.push('  Primer calibre con ampacidad ≥ '+fmt(R.diseno,2)+' A → '+(R.cond?R.cond.c+' ('+R.condAmp+' A)':'fuera de la tabla cargada'));
  L.push('4) Dispositivo de ramal (Art. 430-52'+(ITM_PEND_430_52?pend:'')+'; comerciales 240-6'+(ITM_PEND_240_6?pend:'')+')');
  R.motores.forEach(m=>L.push('  M'+m.n+': '+(m.dev!=null ? fmt(m.flc,2)+' A × '+m.pct+' % ('+ITM_TIPOS[m.tipo].l+') = '+fmt(m.devCalc,2)+' A → '+m.dev+' A' : 'VFD: protección según fabricante (no 430-52)')));
  L.push('  Dispositivo de ramal mayor = '+R.devMax+' A (M'+(R.kDev+1)+')');
  L.push('5) Máximo del ITM (Art. 430-62)');
  L.push('  = '+R.devMax+' (ramal mayor) + '+fmt(R.restoDev,2)+' (suma FLC de los demás motores) + '+fmt(R.sumExt,2)+' (adicionales) = '+fmt(R.max62,2)+' A');
  L.push('6) ITM sugerido');
  L.push('  Comercial inmediato inferior (≤) a '+fmt(R.max62,2)+' A = '+(R.itm!=null?R.itm+' A':'ninguno')+'; debe ser ≥ diseño '+fmt(R.diseno,2)+' A → '+(R.itmOk?'CUMPLE':'NO CUMPLE'));
  if(R.av.length){ L.push(''); L.push('AVISOS'); R.av.forEach(a=>L.push('  - '+a)); }
  L.push('');
  L.push('ALERTAS FIJAS');
  ITM_ALERTAS.forEach(a=>L.push('  - '+a));
  L.push('');
  L.push('PENDIENTE DE VERIFICAR contra el PDF: '+ITM_PENDIENTES.join('; ')+'.');
  return L.join('\n');
}

const ITM_ALERTAS = [
  'La capacidad interruptiva del ITM debe ser MAYOR que la corriente de cortocircuito disponible en el tablero.',
  'Tensión nominal del ITM: 480 V CA. Verifica que la placa del interruptor cubra la tensión del sistema.',
  'Coordina el ITM con los guardamotores y dispositivos de ramal (selectividad / tipo de coordinación del fabricante).',
  'Este cálculo no sustituye la revisión de caída de tensión ni de los factores de corrección por temperatura y agrupamiento.',
];
const ITM_PENDIENTES = [
  'porcentajes de la Tabla 430-52 (solo el 250 % de tiempo inverso viene de tu caso de prueba)',
  'lista de comerciales del Art. 240-6 (15–1200 A)',
  'redacción de 430-24, 430-62 y del tratamiento de VFD',
  'FLC de 575 V para 10 HP (el PDF imprime 44 A, incongruente)',
];

const ITM = {
  S(){ return ST.itm; },
  _render(){
    const st=document.querySelector('.stage'); const y=st?st.scrollTop:0;
    render();
    const st2=document.querySelector('.stage'); if(st2) st2.scrollTop=y;
  },
  refresh(){
    const slot=document.getElementById('itm-out'); if(slot) slot.outerHTML=itmOutHtml();
    const bar=document.getElementById('itm-bar'); if(bar) bar.outerHTML=itmBarHtml();
    const R=itmCalc(ST.itm);
    ST.itm.motores.forEach((m,i)=>{ const s=document.getElementById('itm-ri-'+i); if(s) s.innerHTML=itmRowInfo(R.motores[i]); });
  },
  setSys(v){ ST.itm.vsis=+v; ST.itm.motores.forEach(m=>{ m.v=+v; }); this._render(); },
  setTerm(t){ ST.itm.term=+t; this._render(); },
  addMotor(){ if(ST.itm.motores.length>=ITM_MAX_MOTORES) return; ST.itm.motores.push(itmMotor(5,ST.itm.vsis)); this._render(); },
  delMotor(i){ ST.itm.motores.splice(i,1); this._render(); },
  setM(i,k,val){
    const m=ST.itm.motores[i]; if(!m) return;
    if(k==='hp'||k==='v') m[k]=+val; else if(k==='vfd') m.vfd=!!val; else m[k]=val;
    this._render();
  },
  numM(i,k,val){ ST.itm.motores[i][k]=val; this.refresh(); },
  addExtra(){ if(ST.itm.extras.length>=ITM_MAX_EXTRAS) return; ST.itm.extras.push({va:500, v:ST.itm.vsis, f:1}); this._render(); },
  delExtra(i){ ST.itm.extras.splice(i,1); this._render(); },
  setE(i,k,val){ ST.itm.extras[i][k]=(k==='f'?+val:val); this._render(); },
  numE(i,k,val){ ST.itm.extras[i][k]=val; this.refresh(); },
  limpiar(){ ST.itm.motores=[itmMotor(5,ST.itm.vsis)]; ST.itm.extras=[]; this._render(); },
  caso(){ const t=itmDefault(); t.term=ST.itm.term; ST.itm=t; this._render(); },
  copiar(){
    const txt=itmTexto(itmCalc(ST.itm));
    const ok=()=>Memoria.toast('Desglose copiado al portapapeles');
    const fb=()=>{
      try{
        const ta=document.createElement('textarea'); ta.value=txt; ta.setAttribute('readonly',''); ta.style.cssText='position:fixed;top:0;left:0;opacity:0';
        document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,txt.length);
        const r=document.execCommand('copy'); ta.remove();
        if(r) ok(); else Memoria.toast('No se pudo copiar: mantén presionado el texto del desglose');
      }catch(e){ Memoria.toast('No se pudo copiar'); }
    };
    if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(txt).then(ok, fb); } else fb();
  },
};

function itmRowInfo(row){
  if(!row) return '';

  let s='FLC tabla 430-250: <b>'+fmt(row.flc,1)+' A</b> <span class="itmdim">· col. '+esc(row.col)+'</span>';
  if(row.ivfd!=null) s+=' · I entrada VFD usada: <b>'+fmt(row.ivfd,1)+' A</b> · ramal: según fabricante';
  else s+=' · ramal '+row.pct+' % = '+fmt(row.devCalc,1)+' A → <b>'+row.dev+' A</b>';
  if(row.vfd && row.ivfd==null) s+=' <span class="itmpend">· captura I entrada del VFD</span>';
  return s;
}

function itmOutHtml(){
  const R=itmCalc(ST.itm);
  if(!R.ok){
    return '<div id="itm-out"><div class="rpanel"><div class="rhd"><div class="led danger live"></div><div class="t">RESUMEN · ITM PRINCIPAL</div><div class="badge danger">SIN RESULTADO</div></div>'
      +'<div class="rnote warn" style="margin-top:10px">'+R.err.map(esc).join('<br>')+'</div>'
      +'<div style="height:10px"></div></div></div>';
  }
  const pend = ITM_PEND_430_52 || ITM_PEND_240_6;
  const sev = !R.itmOk ? 'danger' : (pend ? 'warn' : 'ok');
  const badge = !R.itmOk ? 'SIN ITM QUE CUMPLA' : (pend ? 'CON PENDIENTES' : 'CALCULADO');
  const ln = s => '<div class="itmln">'+s+'</div>';
  const P = (flag)=> flag ? ' <span class="itmpend">[PENDIENTE DE VERIFICAR]</span>' : '';
  const step = (t,body)=>'<div class="refcard"><h3>'+t+'</h3><div class="inner">'+body+'</div></div>';
  const m = R.motores, ex=R.extras;
  const s1 = m.map(x=>ln('<b>M'+x.n+'</b> · '+x.hp+' HP · '+x.v+' V · col. '+esc(x.col)+' → <b>'+fmt(x.flc,2)+' A</b>'+(x.ivfd!=null?' → VFD: se usa I entrada '+fmt(x.ivfd,2)+' A':''))).join('')
    + ln('Σ motores = <b>'+fmt(R.sumMot,2)+' A</b>')
    + ex.map(e=>ln('Transformador '+e.n+': '+fmt(e.va,0)+' VA / '+fmt(e.v,0)+' V ('+(e.f===3?'3φ':'1φ')+') = <b>'+fmt(e.I,2)+' A</b>')).join('')
    + (ex.length?ln('Σ adicionales = <b>'+fmt(R.sumExt,2)+' A</b>'):'');
  const s2 = ln('I<sub>dis</sub> = 1.25 × I<sub>mayor</sub> + Σ demás + Σ adicionales')
    + ln('= 1.25 × '+fmt(R.iMax,2)+' (M'+(R.kMax+1)+') + '+fmt(R.resto,2)+' + '+fmt(R.sumExt,2)+' = <b>'+fmt(R.diseno,2)+' A</b>');
  const s3 = ln('Primer calibre Cu con ampacidad ≥ '+fmt(R.diseno,2)+' A, columna de '+R.colTxt+' (temperatura de terminales)')
    + ln('→ <b>'+(R.cond?R.cond.c+' ('+R.condAmp+' A)':'fuera de la tabla cargada')+'</b>');
  const s4 = m.map(x=>ln('<b>M'+x.n+'</b> · '+(x.dev!=null? fmt(x.flc,2)+' A × '+x.pct+' % = '+fmt(x.devCalc,2)+' A → <b>'+x.dev+' A</b> <span class="itmdim">('+esc(ITM_TIPOS[x.tipo].l)+')</span>' : 'VFD: protección según fabricante'))).join('')
    + ln('Dispositivo de ramal mayor = <b>'+R.devMax+' A</b> (M'+(R.kDev+1)+')');
  const s5 = ln('Máx = ramal mayor + Σ FLC de los demás motores + Σ adicionales')
    + ln('= '+R.devMax+' + '+fmt(R.restoDev,2)+' + '+fmt(R.sumExt,2)+' = <b>'+fmt(R.max62,2)+' A</b>');
  const s6 = ln('Comercial inmediato inferior (≤) a '+fmt(R.max62,2)+' A = <b>'+(R.itm!=null?R.itm+' A':'ninguno')+'</b>')
    + ln('Condición ITM ≥ I<sub>dis</sub>: '+(R.itm!=null?R.itm+' ≥ '+fmt(R.diseno,2):'—')+' → <b>'+(R.itmOk?'CUMPLE':'NO CUMPLE')+'</b>');
  return '<div id="itm-out">'
   +'<div class="rpanel"><div class="rhd"><div class="led '+sev+' live"></div><div class="t">RESUMEN · ITM PRINCIPAL</div><div class="badge '+sev+'">'+badge+'</div></div>'
   +'<div class="rbig"><div class="lbl">ITM SUGERIDO</div><div class="val">'+(R.itmOk?R.itm:'—')+'<span class="u">A</span></div><div class="sub">Sistema '+ST.itm.vsis+' V · terminales '+ST.itm.term+' °C</div></div>'
   +'<div class="rrows">'
   +'<div class="rrow hi"><div class="k">Corriente de diseño (430-24)</div><div class="v">'+fmt(R.diseno,1)+' A</div></div>'
   +'<div class="rrow"><div class="k">Calibre mínimo Cu ('+R.colTxt+')</div><div class="v">'+(R.cond?R.cond.c:'—')+'</div></div>'
   +'<div class="rrow"><div class="k">Máximo del ITM (430-62)</div><div class="v">'+fmt(R.max62,1)+' A</div></div>'
   +'<div class="rrow"><div class="k">Ramal mayor / Σ motores</div><div class="v">'+R.devMax+' A / '+fmt(R.sumMot,1)+' A</div></div>'
   +'</div>'
   +(pend?'<div class="rnote warn">Valores marcados PENDIENTE DE VERIFICAR: '+ITM_PENDIENTES.map(esc).join('; ')+'.</div>':'')
   +R.av.map(a=>'<div class="rnote warn" style="margin-top:6px">'+esc(a)+'</div>').join('')
   +'<div style="height:6px"></div></div>'
   +step('1 · FLC por motor — Tabla 430-250 (Art. 430-6(a))', s1)
   +step('2 · Corriente de diseño — Art. 430-24', s2)
   +step('3 · Conductor mínimo — Art. 310 (310-15(b)(16))', s3)
   +step('4 · Dispositivo de ramal — Art. 430-52'+P(ITM_PEND_430_52)+' · 240-6'+P(ITM_PEND_240_6), s4)
   +step('5 · Máximo del ITM — Art. 430-62', s5)
   +step('6 · ITM sugerido', s6)
   +'<div class="refcard"><h3>⚠ Alertas fijas</h3><div class="inner">'+ITM_ALERTAS.map(a=>ln('• '+esc(a))).join('')+'</div></div>'
   +'<div class="rnote">Redondeos: corrientes a 0.01 A; dispositivo de ramal = comercial inmediato superior; ITM = comercial inmediato inferior (≤ al máximo). Unidades en amperes (A).</div>'
   +'<div class="actbtn" style="margin-top:10px" onclick="ITM.copiar()">📋 Copiar desglose como texto</div>'
   +'</div>';
}
